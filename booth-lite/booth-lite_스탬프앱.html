/* 부스 운영 시간 '13:00~16:00'(구분자 ~ - – 아무거나) 해석. 지금 시각 기준 before(시작 전)·open(운영 중)·after(끝남). 형식이 안 맞으면 글자 그대로만 보여줌 */
function hoursState(b){
  const t = (b.hours || '').trim(); if(!t) return null;
  const m = t.match(/(\d{1,2}):(\d{2})\s*[~\-–]\s*(\d{1,2}):(\d{2})/); if(!m) return { text: t, state: '' };
  const now = new Date(), cur = now.getHours() * 60 + now.getMinutes(), st = +m[1] * 60 + +m[2], en = +m[3] * 60 + +m[4];
  const state = cur < st ? 'before' : cur >= en ? 'after' : 'open';
  return { text: t, state, start: `${m[1].padStart(2, '0')}:${m[2]}`, label: state === 'before' ? `${+m[1]}:${m[2]}부터 운영` : state === 'after' ? '운영 끝남' : '운영 중' };
}
function hoursChipHTML(b){
  const h = hoursState(b); let out = closedSet().has(b.id) ? '<div class="bhours before">⏸ 지금 쉬는 중</div>' : ''; out += h ? `<div class="bhours ${h.state}">🕒 ${esc(h.text)}${h.label ? ' · ' + h.label : ''}</div>` : '';
  const v = b.variant; if(v && v.at) out += b.switched ? `<div class="bhours">🔁 ${esc(v.at)} 전엔 ${v.n ? esc(b.n) + ' ' : ''}${esc(b.baseName)}</div>` : `<div class="bhours before">🔁 ${esc(v.at)}부터 ${v.n ? esc(v.n) + ' ' : ''}${esc(v.name)}</div>`;
  return out;
}
function boothItemHTML(b){
  const c = catOf(b.cat), done = stampedIds().has(b.id);
  return `<button class="bitem ${boothOpen(b) ? '' : 'off'}" style="--c:${c.color}" data-go="${esc('/booth/' + b.n)}">
    <div class="bnum ${done ? 'done' : ''}">${esc(bn(b))}</div>
    <div class="grow"><div class="bname">${esc(b.name)}</div><div class="borg">${esc(b.org)}</div><div class="bcat">${esc(c.name)}</div>${hoursChipHTML(b)}${targetChipHTML(b)}${hasStamp(b) ? '' : '<div><span class="btarget nost">도장 없음 · 체험만</span></div>'}</div>
    <span class="bgo">${I.chev}</span></button>`;
}
function filteredBooths(){
  const q = S.q.trim().toLowerCase();
  return S.booths.map(bv).filter(b => boothForMe(b) && !S.hiddenCats.has(b.cat) && (!q || b.name.toLowerCase().includes(q) || b.n.includes(q) || bn(b).toLowerCase().includes(q) || (b.org || '').toLowerCase().includes(q)));
}
function catChipsHTML(){
  return CATS.map(c => { const n = S.booths.filter(b => bv(b).cat === c.id && boothForMe(b)).length; if(!n) return ''; const on = !S.hiddenCats.has(c.id);

function wireChips(root, after){

/* 홈: 긴급 공지(있으면) → 도장 카드 → 다음 일정 → 부스 검색·분류 칩·목록 */

  const nextLive = next && (() => { const r = schedRange(next.time), st = toMin(r.start), end = toMin(r.end); return end !== null && st !== null && st <= now && now < end; })();

/* 다른 폰·브라우저의 기록 이어받기: 내 스탬프 화면의 6자리 코드 + 이름. 운영본부에서 이름으로 찾아 코드를 알려줄 수도 있음 */
function renderRecover(returnTo){
  returnTo = safeReturn(returnTo);
  shell(null, '기록 이어받기', `
    <div class="card" style="display:flex;flex-direction:column;gap:14px">
      <p class="desc">전에 쓰던 폰(또는 카카오톡 브라우저 등)의 <b>내 스탬프</b> 화면 아래에 있는 <b>6자리 코드</b>와 이름을 적어주세요.<br>코드를 모르면 운영본부에서 이름으로 찾아드려요.</p>
      <div class="field"><label>6자리 코드</label><input class="inp" id="rcCode" placeholder="예: A1B2C3" maxlength="6" autocomplete="off" style="text-transform:uppercase;letter-spacing:.15em;font-weight:800"></div>
      <div class="field"><label>이름</label><input class="inp" id="rcName" placeholder="등록할 때 쓴 이름" maxlength="20" autocomplete="off"></div>
      <button class="btn blue full" id="rcGo">이어받기</button>
      <button class="btn soft full" id="rcNew">새로 등록할게요</button>
    </div>`, { noTabs: true, back: true });
  $('#rcNew').onclick = () => renderRegister(returnTo);
  $('#rcGo').onclick = async () => {
    const code = $('#rcCode').value.trim().toUpperCase(), name = $('#rcName').value.trim();
    if(code.length !== 6) return toast('코드 6자리를 적어주세요'), $('#rcCode').focus();
    if(!name) return toast('이름을 적어주세요'), $('#rcName').focus();
    $('#rcGo').disabled = true;
    try{
      const v = await DB.recover(code, name);
      if(!v){ $('#rcGo').disabled = false; return toast('코드나 이름이 맞지 않아요'); }
      S.me = v; S.myStamps = await DB.stampsOf(v.id); S.pending = []; S.surveyOpenAt = 0; await store.set('wj:survey_open', 0);
      await store.set('wj:me', v.id); await store.set('wj:me_cache', v); await store.set('wj:stamps_cache', S.myStamps); await store.set('wj:pending', []);
      toast(`${v.name}님, 도장 ${S.myStamps.length}개를 이어받았어요`);
      go(returnTo || '/', true);
    }catch(e){ $('#rcGo').disabled = false; toast(e.message || '통신 실패'); }
  };
}

  shell(null, '', `

    </div>
    <div class="steps">
      <div class="step"><div class="ic">📱</div><div class="t">부스 QR 찍기</div><div class="s">폰 카메라로</div></div>

      <div class="step"><div class="ic">🎁</div><div class="t">설문 후 선물</div><div class="s">운영본부에서</div></div>
    </div>

    <div class="card" style="display:flex;flex-direction:column;gap:14px">

      <div class="field"><label>이름</label><input class="inp" id="rName" placeholder="홍길동" maxlength="20" autocomplete="off"></div>
      <label class="consent"><input type="checkbox" id="rConsent"><span><b>개인정보 수집·이용 동의</b><br>행사 운영과 선물 지급 확인을 위해 ${regLabels()}을 수집하며, 행사 종료 후 30일 이내 삭제합니다. 다른 목적으로 쓰지 않아요.</span></label>
      <button class="btn blue full" id="rGo">시작하기</button>

    { noTabs: true, back: true });
  $('#rRecover').onclick = () => renderRecover(returnTo);
  /* 이미 등록된 폰(이 탭의 S.me, 또는 다른 탭이 저장한 wj:me): 새로 등록하면 기록이 둘로 나뉘므로 안내하고 '그대로 쓰기' 제공 */
  (async () => {
    let v = S.me; if(!v){ const id = await store.get('wj:me'); if(id){ const c = await store.get('wj:me_cache'); if(c && c.id === id) v = c; else { try{ v = await DB.getVisitor(id); }catch(e){ v = null; } } } }
    const box = $('#rExist'); if(!v || !box) return;
    $('#rExistName').textContent = v.name; box.style.display = '';
    $('#rExistUse').onclick = async () => {
      if(!S.me || S.me.id !== v.id){ S.me = v; try{ S.myStamps = await DB.stampsOf(v.id); }catch(e){ S.myStamps = (await store.get('wj:stamps_cache')) || []; } S.pending = (await store.get('wj:pending')) || []; S.surveyOpenAt = (await store.get('wj:survey_open')) || 0; await store.set('wj:me', v.id); await store.set('wj:me_cache', v); await store.set('wj:stamps_cache', S.myStamps); }
      toast(`${v.name}님, 기록을 그대로 이어가요`); go(returnTo || '/', true);
    };
  })();
  $('#rGo').onclick = async () => {   // 항목은 regFields() (관리자 › 행사 설정). DB 열: school = 소속, grade = 나이, gender = 연락처
    const name = $('#rName').value.trim(), f = readRegFields('r'); if(f.err) return toast(f.err), $(f.focus).focus();

    if(!name) return toast('이름을 적어주세요'), $('#rName').focus();
    if(!$('#rConsent').checked) return toast('개인정보 동의가 필요해요');
    $('#rGo').disabled = true;
    try{
      S.me = await DB.createVisitor({ name, school, grade, gender }); S.myStamps = []; S.pending = []; await store.set('wj:pending', []); S.surveyOpenAt = 0; await store.set('wj:survey_open', 0);   // 이전 기록의 대기 도장이 새 사람에게 붙지 않게
      await store.set('wj:me', S.me.id);
      toast(`${name}님, 환영해요!`);
      go(returnTo || '/', true);
    }catch(e){ $('#rGo').disabled = false; toast('저장에 실패했어요. 다시 눌러주세요'); }
  };
}

/* 부스 소개: 사진·소개·위치·유튜브·PDF·도장 상태. QR 찍기 버튼은 스캐너로 */
function renderBooth(n){

    <div class="hero" style="--c:${c.color}">
      <div class="num">BOOTH ${esc(bn(b))}</div>
      <h1 class="name">${esc(b.name)}</h1>
      <div class="org">${esc(b.org)}</div>
      <span class="pill"><span class="dot"></span>${esc(c.name)}</span>${b.target ? `<span class="pill" style="margin-left:6px">${esc(targetName(b.target))} 대상</span>` : ''}
    </div>
    ${b.img ? `<div class="bimgwrap" id="bImgWrap" hidden><img class="bimg" id="bImg" alt="${esc(b.name)} 부스 사진"><span class="hint">탭하면 크게 보기</span></div>` : ''}

    ${ytId(b.video) ? `<div class="card tight"><div class="kv"><div class="k">체험 영상</div><div class="yt"><iframe src="https://www.youtube-nocookie.com/embed/${ytId(b.video)}?rel=0" title="${esc(b.name)} 영상" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div></div></div>` : ''}
    ${b.pdf ? `<a class="btn line full" id="bPdf" target="_blank" rel="noopener" hidden>${I.doc} 부스 자료 PDF 보기</a>` : ''}
    ${!st && !hasStamp(b) ? `<div class="stampstate">
      <div class="ic">${I.bell}</div>
      <div class="grow"><div class="t">도장 없는 부스예요</div><div class="s">QR 없이 자유롭게 체험만 하는 부스예요. 도장 개수에는 들어가지 않아요</div></div>
    </div>` : `<div class="stampstate ${st ? 'done' : ''}">
      <div class="ic">${st ? I.check : I.qr}</div>
      <div class="grow"><div class="t">${st ? '도장 찍음' : '부스 QR을 찍으면 도장이 찍혀요'}</div><div class="s">${st ? (st.pending ? '전송 대기 중 · 통신되면 자동 전송' : fmtTime(st.at) + ' 체험 완료') : '부스 앞 안내판의 QR을 폰 카메라로 스캔'}</div></div>
    </div>`}
    ${closedSet().has(b.id) ? `<div class="notice">${I.bell}<span>지금은 잠시 쉬는 중이에요. 다시 열리면 흐린 표시가 사라져요</span></div>` : ''}
    ${st || !hasStamp(b) ? '' : boothForMe(b) ? `<button class="btn sun full" onclick="openScanner()">${I.qr} QR 찍고 도장 받기</button>` : `<div class="notice">${I.bell}<span>${esc(targetName(b.target))} 친구들만 참여하는 부스예요</span></div>`}
    ${CONFIG.miniMode ? '' : `<button class="btn ${st ? '' : 'line'} full" data-go="${esc('/map/' + b.n)}">${I.pin} 지도에서 위치 보기</button>`}

  if(b.pdf) resolveFileUrl(b.pdf).then(u => { const el = $('#bPdf'); if(el && u){ el.href = u; el.hidden = false; } });

/* 도장 화면 (#/stamp/번호). QR 딥링크·스캐너·테스트 입력이 전부 여기로 온다.
   미등록이면 등록 화면으로 보냈다가 돌아옴. 토큰은 qrTok 에서 꺼내 addStamp 에 동봉.
   결과별 화면: 성공(완주면 confetti) / 이미 찍음 / 통신 실패→pending 안내 / 서버 거절(토큰·너무 빠름)→✋ 화면 */
function renderStamp(n){
  const b = boothByNLoose(n); if(!b){ toast('부스 번호를 확인해 주세요 (' + String(n ?? '') + ')'); return go('/', true); }
  if(CONFIG.miniMode && S.admin){ go(admPath('/manual/' + encodeURIComponent(b.n)), true); return; }   // 관리자 폰으로 부스 QR 을 찍으면 → 수기 도장
  if(!S.me){ go('/register/' + encodeURIComponent('/stamp/' + n), true); return; }
  const c = catOf(b.cat);
  shell('/my', '', `<div class="stampscreen" id="stampArea"><div class="muted small">도장 찍는 중…</div></div>`, { noTop: true });
  if(!hasStamp(b)){   // 도장 없는 부스 (예전에 뽑은 QR·링크로 들어온 경우)
    $('#stampArea').innerHTML = `
      <div class="bigstamp dup"><div><div class="n">✋</div><div class="t">도장 없음</div></div></div>
      <div>
        <div class="stamp-h">도장 없는 부스예요</div>
        <p class="stamp-p" style="margin-top:8px">${esc(b.name)} 부스는 체험만 하는 곳이라 도장이 찍히지 않아요. 다른 부스에서 도장을 모아보세요.</p>
      </div>
      <button class="btn sun full" style="max-width:340px" onclick="go('/')">부스 목록 보기</button>`;
    return;
  }
  if(!boothForMe(b)){   // 대상(초등 이하 / 중고등)이 아닌 학생 → 도장 안 찍고 안내만
    $('#stampArea').innerHTML = `
      <div class="bigstamp dup"><div><div class="n">✋</div><div class="t">대상 아님</div></div></div>
      <div>
        <div class="stamp-h">${esc(targetName(b.target))} 친구들만 참여하는 부스예요</div>
        <p class="stamp-p" style="margin-top:8px">이 부스는 ${esc(targetName(b.target))} 대상이라 도장이 찍히지 않아요. 다른 부스에서 도장을 모아보세요.</p>
      </div>
      <button class="btn sun full" style="max-width:340px" onclick="go('/')">부스 목록 보기</button>`;
    return;
  }
  const here = () => { const area = $('#stampArea'); let h = location.hash; try{ h = decodeURIComponent(h); }catch(e){} return area && h === '#/stamp/' + n ? area : null; };   // await 사이에 다른 화면으로 갔으면(뒤로가기·빠른 이동) 결과를 그리지 않음
  (async () => {
    let res; const token = qrTok.get(b.n);
    if(stampedIds().has(b.id)) res = { ok: false, dup: true };                       // 이미 찍었거나 전송 대기 중
    else {
      try{ res = await DB.addStamp(S.me.id, b.id, token); if(res.ok){ S.myStamps.push(res.stamp); await store.set('wj:stamps_cache', S.myStamps); } else if(res.dup){ try{ S.myStamps = await DB.stampsOf(S.me.id); await store.set('wj:stamps_cache', S.myStamps); }catch(e){} } }   // dup = 다른 탭·폰에서 이미 찍음 → 서버 목록으로 맞춤
      catch(e){ S.pending.push({ boothId: b.id, token, at: Date.now() }); await store.set('wj:pending', S.pending); res = { ok: true, queued: true }; }   // 통신 실패 → 폰에 저장, 나중에 자동 전송
    }
    if(res.badToken || res.tooFast){   // 서버가 거절: 토큰 없음(주소창에 번호만 침·링크 위조) / 너무 빠름(링크 공유로 연달아 찍기)
      const area = here(); if(!area) return; area.innerHTML = `
        <div class="bigstamp dup"><div><div class="n">✋</div><div class="t">${res.badToken ? '확인 불가' : '잠깐만요'}</div></div></div>
        <div>
          <div class="stamp-h">${res.badToken ? '부스 앞 QR을 찍어주세요' : `${res.wait}초 후에 찍을 수 있어요`}</div>
          <p class="stamp-p" style="margin-top:8px">${res.badToken ? '이 링크로는 도장이 안 찍혀요. 부스 앞 안내판의 QR을 카메라로 직접 찍어야 해요.' : `도장은 ${CONFIG.stampGapSec >= 60 ? Math.floor(CONFIG.stampGapSec / 60) + '분' + (CONFIG.stampGapSec % 60 ? ' ' + CONFIG.stampGapSec % 60 + '초' : '') : CONFIG.stampGapSec + '초'}에 하나씩 찍혀요. 부스 체험을 마치고 다시 찍어주세요.`}</p>
        </div>
        <button class="btn sun full" style="max-width:340px" onclick="openScanner()">${I.qr} QR 다시 찍기</button>
        <button class="btn soft sm" onclick="go('/')">홈으로</button>`;
      return;
    }
    const local = allStampsLocal(), n0 = local.length, goal = CONFIG.stampGoal, justDone = res.ok && n0 === goal && !S.pending.length;
    const area = here(); if(!area) return;
    if(justDone) confetti();
    area.innerHTML = `
      <div class="bigstamp ${res.dup ? 'dup' : ''}"><div><div class="n">${esc(bn(b))}</div><div class="t">${res.dup ? '이미 찍었어요' : '체험 완료'}</div></div></div>
      <div>
        <div class="stamp-h">${res.dup ? '이 부스는 이미 찍었어요' : justDone ? `${goal}개 완주! 🎉` : n0 >= goal && S.pending.length ? '전송이 끝나면 완주예요' : `${esc(b.name)}`}</div>
        <p class="stamp-p" style="margin-top:8px">${res.dup ? '다른 부스에서 도장을 모아보세요.' : justDone ? '설문에 참여하면 선물 교환권이 열려요. 교환권을 운영본부에서 보여주고 선물을 받아가세요.' : `${esc(b.org)} · <span style="color:${c.color};font-weight:800">${esc(c.name)}</span><br>${n0 >= goal ? `벌써 ${n0}곳째 방문이에요` : `${goal - n0}개 더 모으면 선물이에요`}`}</p>
      </div>
      ${res.queued ? `<div class="notice" style="max-width:340px;width:100%">${I.bell}<span>통신이 불안정해서 폰에 저장해 뒀어요. 연결되면 자동으로 보내져요.</span></div>` : ''}
      <div class="slots" style="width:100%;max-width:340px;--cols:${slotCols(goal)}">${Array.from({ length: goal }, (_, i) => { const s = local[i]; return s ? `<div class="slot ink ${s.pending ? 'pend' : ''}" style="animation-delay:${.2 + i * .06}s"><span class="num">${esc(bn(boothById(s.boothId)))}</span></div>` : `<div class="slot ${i === goal - 1 ? 'gift' : ''}">${i === goal - 1 ? '🎁' : i + 1}</div>`; }).join('')}</div>
      ${justDone ? `<button class="btn sun full" style="max-width:340px" onclick="go('/my')">📝 설문 참여하고 교환권 받기</button>` : `<button class="btn full" style="max-width:340px" data-go="${esc('/map/' + b.n)}">${I.map} 다음 부스 찾기</button>`}
      <button class="btn soft sm" onclick="go('/')">홈으로</button>`;
  })();
}

/* 내 스탬프: 내 코드(이어받기용) → 도장 카드 → 완주 시 설문 버튼 2개(참여하기·다 했어요) 또는 교환권(QR+코드) → 찍은 부스 목록 */
function renderMy(){
  if(!S.me) return renderRegister('/my');
  const done = goalReached(), n = S.myStamps.length;
  clearInterval(S.svTimer);
  if(!surveyOn() && done && !S.pending.length && !S.me.surveyAt){ markSurveyDone().then(renderMy); return; }   // 설문 안 씀 → 완주 즉시 교환권
  if(S.surveyReturn){   // 구글폼 확인 메시지의 링크(?survey)로 돌아온 경우 — 완주자면 바로 완료 처리
    S.surveyReturn = false;
    if(done && !S.pending.length && !S.me.surveyAt){ markSurveyDone().then(renderMy); return; }
    if(!done) toast('아직 완주 전이에요. 도장을 다 모으면 교환권이 열려요');
  }
  shell('/my', '내 스탬프', `
    ${stampCardHTML()}
    <div class="small muted" style="text-align:center;line-height:1.6">내 코드 <b style="color:var(--ink);letter-spacing:.12em">${shortCode(S.me.id)}</b> · 폰이나 브라우저를 바꾸면 이 코드와 이름으로 <b>기록 이어받기</b></div>
    ${done && !S.pending.length ? (S.me.surveyAt || S.me.giftAt ? `
    <div class="voucher">
      <div class="v-head"><div><div class="t">선물 교환권</div><div class="s">${esc(S.me.name)} · ${esc([S.me.school, S.me.grade].filter(Boolean).join(' '))}</div></div><span style="font-size:28px">🎁</span></div>
      <div class="v-body">
        ${S.me.giftAt ? `<div class="v-done">${I.check} ${fmtTime(S.me.giftAt)} 선물 받았어요</div>` : `
        <div class="v-done" style="align-self:stretch;justify-content:center">${I.check} 설문 참여 완료 · 운영본부에서 선물 받아가세요</div>
        <div class="qr" id="myQr"></div>
        <div class="code">${shortCode(S.me.id)}</div>
        <p class="small muted" style="text-align:center;line-height:1.6">운영본부(정문 오른쪽) 담당자에게 이 화면을 보여주세요.<br>QR 또는 위 코드로 확인합니다.</p>`}
      </div>
    </div>` : `
    <div class="voucher">
      <div class="v-head"><div><div class="t">완주! 마지막 한 걸음</div><div class="s">설문에 참여하면 교환권이 열려요</div></div><span style="font-size:28px">📝</span></div>
      <div class="v-body">
        ${surveyMode() === 'app' ? `
        <p class="desc small" style="text-align:center;line-height:1.7;margin:0">짧은 설문 ${SURVEY.length}문항에 답하면<br>바로 교환권이 나와요. <b>운영본부</b>에서 선물을 받아요.</p>
        <button class="btn blue full" onclick="go('/survey')">📝 설문 참여하고 교환권 받기</button>` : `
        <p class="desc small" style="text-align:center;line-height:1.7;margin:0">① <b>설문 참여하기</b>로 설문을 마치고<br>② 돌아와서 <b>설문 다 했어요</b>를 눌러주세요.<br>교환권이 나오면 <b>운영본부</b>에서 선물을 받아요.</p>
        <button class="btn blue full" id="svOpen">📝 설문 참여하기</button>
        <button class="btn line full" id="svDone" disabled>설문 다 했어요</button>
        <p class="small muted" id="svHint" style="text-align:center;margin:0;min-height:1.4em"></p>`}
      </div>
    </div>`) : ''}
    <div class="h-sec">방문한 부스 <span class="muted small">${allStampsLocal().length}곳</span></div>
    ${S.pending.length ? `<div class="notice">${I.bell}<span>도장 ${S.pending.length}개가 아직 서버에 안 갔어요. 통신되면 자동 전송돼요. <b style="cursor:pointer" onclick="flushPending()">지금 보내기</b></span></div>` : ''}
    ${allStampsLocal().length ? `<div class="stamp-grid">${allStampsLocal().reverse().map(s => { const b = boothById(s.boothId); return `<div class="sg" data-go="${esc('/booth/' + (b ? b.n : ''))}"><div class="n ${s.pending ? 'pend' : ''}">${esc(bn(b) || '?')}</div><div class="t">${esc(b?.name || '')}</div><div class="tm">${s.pending ? '전송 대기' : fmtTime(s.at)}</div></div>`; }).join('')}</div>`
        : `<div class="empty"><b>아직 도장이 없어요</b>가까운 부스의 QR부터 찍어보세요</div><button class="btn full" onclick="go('/map')">${I.map} 지도 열기</button>`}`);
  if($('#myQr')) loadQRCode().then(() => { const el = $('#myQr'); if(el && !el.firstChild) new QRCode(el, { text: 'WJ:' + S.me.id, width: 164, height: 164, correctLevel: QRCode.CorrectLevel.M }); }).catch(() => { const el = $('#myQr'); if(el) el.innerHTML = '<div class="small muted" style="padding:20px">QR 그리기 실패 — 아래 코드로 확인받으세요</div>'; });
  /* 자기신고 보강(A안): '설문 참여하기'를 누른 시각을 폰에 저장하고, surveyMinSec 초가 지나야 '다 했어요'가 켜진다.
     열어보지도 않고 누르기·열자마자 누르기를 막는 정도. 링크가 비어 있으면(설문 준비 전) 기다리지 않음 */
  const svOpen = $('#svOpen'), svDone = $('#svDone'), svHint = $('#svHint');
  if(svOpen){
    const minMs = (CONFIG.surveyUrl ? CONFIG.surveyMinSec : 0) * 1000;
    const tick = () => {
      if(!document.contains(svDone)) return clearInterval(S.svTimer);
      if(!S.surveyOpenAt){ svDone.disabled = true; svHint.textContent = '설문 참여하기를 먼저 눌러주세요'; return; }
      const left = Math.ceil((S.surveyOpenAt + minMs - Date.now()) / 1000);
      svOpen.textContent = '📝 설문 다시 열기';
      if(left > 0){ svDone.disabled = true; svHint.textContent = `설문 작성 중… ${left}초 뒤에 누를 수 있어요`; }
      else { svDone.disabled = false; svHint.textContent = '설문을 마쳤으면 눌러주세요'; clearInterval(S.svTimer); }
    };
    S.svTimer = setInterval(tick, 500); tick();
    svOpen.onclick = async () => {
      if(!S.surveyOpenAt){ S.surveyOpenAt = Date.now(); await store.set('wj:survey_open', S.surveyOpenAt); if(!S.svTimer) S.svTimer = setInterval(tick, 500); }
      const u = surveyLink(); if(u) window.open(u, '_blank', 'noopener'); else toast('설문 링크가 아직 준비 중이에요. 바로 다 했어요를 누를 수 있어요');
      tick();
    };
    svDone.onclick = async () => {
      if(!S.surveyOpenAt) return toast('먼저 설문 참여하기를 눌러주세요');
      if(S.surveyOpenAt + minMs > Date.now()) return tick();
      svDone.disabled = true;
      if(await markSurveyDone()) renderMy(); else svDone.disabled = false;
    };
  }
}

/* 앱 내 설문 (#/survey). 완주자만. 문항은 SURVEY(관리자 › 설문). 답 {문항id: 값} → DB.submitSurvey → 서버가 완주 확인 후 저장 + survey_done_at → 교환권.
   부스 고르기 문항은 내가 도장 찍은 부스를 칩으로 보여준다. 답은 이름과 함께 저장되지 않음(uuid 만) */
function renderSurvey(){
  if(!S.me) return renderRegister('/survey');
  if(!goalReached()) return go('/my', true);
  if(S.me.surveyAt || !surveyOn()) return go('/my', true);
  if(surveyMode() !== 'app') return go('/my', true);   // 외부 설문 링크가 설정돼 있으면 앱 내 설문으로 우회 못 하게
  const A = {}, req = SURVEY.filter(q => q.required);
  const answered = q => { const v = A[q.id]; return Array.isArray(v) ? v.length > 0 : v !== undefined && String(v).trim() !== ''; };
  const mine = allStampsLocal().map(s => boothById(s.boothId)).filter(Boolean);
  const body = q => {
    if(q.type === 'scale') return `<div class="sv-scale" role="radiogroup" aria-label="별점">${[1, 2, 3, 4, 5].map(i => `<button type="button" data-v="${i}" aria-label="${i}점" class="${A[q.id] >= i ? 'lit' : ''} ${A[q.id] === i ? 'on' : ''}">★</button>`).join('')}</div><div class="sv-scale-l"><span>별로예요</span><span>최고예요</span></div>`;
    if(q.type === 'single' || q.type === 'multi') return `<div class="sv-opts">${(q.opts || []).map(o => `<button type="button" class="sv-opt ${q.type === 'multi' ? 'chk' : ''}" data-v="${esc(o)}"><span class="dot"></span>${esc(o)}</button>`).join('')}</div>`;
    if(q.type === 'booth') return `<div class="sv-chips">${mine.map(b => `<button type="button" class="sv-chip" data-v="${esc(b.n)}"><b>${esc(bn(bv(b)))}</b>${esc(clipName(b.name, 12))}</button>`).join('')}</div>${mine.length ? '' : `<input class="inp" inputmode="numeric" placeholder="부스 번호 (예: 12)" maxlength="4" data-text>`}`;
    if(q.type === 'text') return `<textarea class="inp" placeholder="자유롭게 적어주세요" maxlength="300" data-text></textarea>`;
    return '';
  };
  shell('/my', '참여 설문', `
    <div class="sv-hint"><span>🎁</span><span>설문을 제출하면 바로 선물 교환권이 열려요. 1분이면 끝나요.</span></div>
    <div class="sv-prog"><i id="svBar"></i></div>
    ${SURVEY.map((q, i) => `<div class="sv-q" data-id="${esc(q.id)}">
      <div class="n">Q${i + 1}${q.required ? '' : ' · 선택'}</div>
      <div class="t">${esc(q.title)}</div>${q.sub ? `<div class="s">${esc(q.sub)}</div>` : ''}
      ${body(q)}
      <div class="err-msg">답변을 골라주세요</div>
    </div>`).join('')}
    <p class="small muted" style="text-align:center;line-height:1.6">답변은 행사 운영 개선에만 쓰이고 이름과 함께 저장되지 않아요.</p>
    <div class="sv-foot"><span class="cnt" id="svCnt"></span><button class="btn blue full" id="svSubmit">제출하고 교환권 받기</button></div>`,
    { back: true, sub: CONFIG.eventTitle });
  const update = () => { const n = req.filter(answered).length; $('#svCnt').textContent = `${n} / ${req.length} 답변`; $('#svBar').style.width = (req.length ? n / req.length * 100 : 100) + '%'; };
  $$('.sv-q').forEach(el => {
    const q = SURVEY.find(x => x.id === el.dataset.id);
    $$('.sv-scale button, .sv-opt, .sv-chip', el).forEach(b => b.onclick = () => {
      if(q.type === 'multi'){ const set = new Set(A[q.id] || []); set.has(b.dataset.v) ? set.delete(b.dataset.v) : set.add(b.dataset.v); A[q.id] = [...set]; b.classList.toggle('on'); }
      else { A[q.id] = q.type === 'scale' ? +b.dataset.v : b.dataset.v; $$('.sv-scale button, .sv-opt, .sv-chip', el).forEach(x => { x.classList.toggle('on', x === b); if(q.type === 'scale') x.classList.toggle('lit', +x.dataset.v <= +b.dataset.v); }); }
      el.classList.remove('bad'); update();
    });
    const t = $('[data-text]', el); if(t) t.oninput = () => { A[q.id] = t.value; el.classList.remove('bad'); update(); };
  });
  update();
  $('#svSubmit').onclick = async () => {
    const missing = req.filter(q => !answered(q));
    if(missing.length){ missing.forEach(q => $(`.sv-q[data-id="${q.id}"]`).classList.add('bad')); $(`.sv-q[data-id="${missing[0].id}"]`).scrollIntoView({ behavior: 'smooth', block: 'center' }); return toast(`${missing.length}개 문항이 남았어요`); }
    const answers = {}; SURVEY.forEach(q => { if(answered(q)) answers[q.id] = typeof A[q.id] === 'string' ? A[q.id].trim().slice(0, 300) : A[q.id]; });
    $('#svSubmit').disabled = true;
    try{ await DB.submitSurvey(S.me.id, answers); S.me.surveyAt = Date.now(); await store.set('wj:me_cache', S.me); confetti(); toast('고마워요! 교환권이 열렸어요'); go('/my', true); }
    catch(e){ $('#svSubmit').disabled = false; toast(e.message || '저장에 실패했어요. 다시 눌러주세요'); }
  };
}

/* 행사 안내: 오늘의 일정(SCHEDULE)·자료 링크(RESOURCES)·선물 교환 안내. 내용은 관리자 › 행사 설정에서 바뀜 */
function renderInfo(){
  shell('/info', '행사 안내', `
    <div class="card"><div class="h-sec" style="margin:0 0 6px">오늘의 일정</div>
      <div class="timeline">${SCHEDULE.map(s => `<div class="tl"><div class="tm">${schedTimeHTML(s.time)}</div><div><div class="t">${esc(s.title)}</div><div class="s">${esc(s.place)}</div></div></div>`).join('')}</div></div>
    <div class="h-sec">자료</div>
    ${RESOURCES.map(r => `<a class="link" href="${esc(r.url)}" target="_blank" rel="noopener"><span class="ic">${I.doc}</span><div class="grow"><div class="t">${esc(r.title)}</div><div class="s">${esc(r.desc)}</div></div><span class="bgo">${I.chev}</span></a>`).join('')}
    <div class="h-sec">선물 교환</div>
    <div class="card"><p class="desc">부스 ${CONFIG.stampGoal}곳의 도장을 모으고 <b>설문</b>에 참여하면 <b>운영본부</b>에서 선물을 드려요. 내 스탬프 화면의 교환권을 보여주세요.${CONFIG.giftDeadline ? ` 교환은 ${esc(CONFIG.giftDeadline)}까지예요.` : ''}</p></div>
    <p class="small muted" style="text-align:center;line-height:1.6">${esc(CONFIG.eventDate)} · ${esc(CONFIG.venue)}${CONFIG.contact ? ' · ' + esc(CONFIG.contact) : ''}</p>`,
    { sub: CONFIG.eventTitle });

/* =====================================================================
   MAP
   ===================================================================== */
const view = { k: 1, tx: 0, ty: 0 };
function mapSVG(){
  const g = geom(); const { W, H, cx, cy } = g; const pos = boothPos(g); const done = stampedIds();
  const box = mapBox();
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${box.w}" height="${box.h}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" id="mapSvg"><g id="world">`;
  s += `<rect x="12" y="12" width="${W - 24}" height="${H - 24}" rx="130" fill="var(--plaza)"/>`;
  s += `<rect ${g.track.rect} fill="var(--track)"/>`;
  g.lanes.forEach(l => s += `<rect ${l.rect} fill="none" stroke="rgba(255,255,255,.7)" stroke-width="2"/>`);
  s += `<rect ${g.field.rect} fill="var(--field)"/>`;
  const P = g.pitch, ln = 'fill="none" stroke="rgba(255,255,255,.8)" stroke-width="2.5"';                               // 축구장
  s += `<g ${ln}><rect x="${P.x}" y="${P.y}" width="${P.w}" height="${P.h}"/><line x1="${cx}" y1="${P.y}" x2="${cx}" y2="${P.y + P.h}"/><circle cx="${cx}" cy="${cy}" r="40"/>
        <rect x="${P.x}" y="${cy - 64}" width="72" height="128"/><rect x="${P.x + P.w - 72}" y="${cy - 64}" width="72" height="128"/></g>`;
  s += `<rect x="${P.x - 14}" y="${cy - 30}" width="14" height="60" rx="3" fill="#4E8A5C"/><rect x="${P.x + P.w}" y="${cy - 30}" width="14" height="60" rx="3" fill="#4E8A5C"/>`;
  const mg = g.gates[0];                                                                                                   // 정문 → 트랙 통로
  s += `<line x1="${cx}" y1="${mg.y + mg.h / 2}" x2="${cx}" y2="${cy - g.far.hh + 4}" stroke="var(--ink-3)" stroke-width="2" stroke-dasharray="4 7"/>`;
  g.fac.forEach(f => {
    const fill = f.type === 'hq' ? 'var(--ink)' : '#fff', col = f.type === 'hq' ? '#fff' : 'var(--ink-2)';
    s += `<g class="fac"><rect x="${f.x - f.w / 2}" y="${f.y - f.h / 2}" width="${f.w}" height="${f.h}" rx="${Math.min(f.w, f.h) / 2}" fill="${fill}" ${f.type !== 'hq' ? 'stroke="var(--line)" stroke-width="2"' : ''}/>
      <text x="${f.x}" y="${f.y}" font-size="14" fill="${col}">${esc(f.label)}</text></g>`;
  });
  facilities().forEach(f => {   // 관리자가 놓은 화장실·휴지통
    const lw = textW(f.label, 11) + 12;
    const sq = f.type === 'wc';                                                                                       // 화장실은 네모에 아이콘 꽉 차게, 휴지통은 동그라미
    s += `<g class="fac usr" data-fac="${esc(f.id)}">${sq ? `<rect x="${f.x - 19}" y="${f.y - 19}" width="38" height="38" rx="9" fill="#fff" stroke="var(--line)" stroke-width="2"/><text x="${f.x}" y="${f.y + 2}" font-size="30">${FAC_ICON[f.type]}</text>`
      : `<circle cx="${f.x}" cy="${f.y}" r="17" fill="#fff" stroke="var(--line)" stroke-width="2"/><text x="${f.x}" y="${f.y + 1}" font-size="18">${FAC_ICON[f.type] || '📍'}</text>`}
      <rect x="${f.x - lw / 2}" y="${f.y + (sq ? 23 : 21)}" width="${lw}" height="17" rx="8" fill="#fff" stroke="var(--line)" stroke-width="1.5"/><text x="${f.x}" y="${f.y + (sq ? 31.5 : 29.5)}" font-size="11" fill="var(--ink-2)">${esc(f.label)}</text></g>`;
  });
  g.gates.forEach(gt => s += `<g class="fac gate" data-gate="${gt.id}" transform="translate(${gt.x.toFixed(1)} ${gt.y.toFixed(1)}) rotate(${(gt.rot || 0).toFixed(1)})"><rect x="${-gt.w / 2}" y="${-gt.h / 2}" width="${gt.w}" height="${gt.h}" rx="10" fill="var(--gate)"/>
      <path d="M -9 ${gt.h / 2 + 2} l 9 12 l 9 -12 z" fill="var(--gate)"/><text x="0" y="0" font-size="14" fill="#fff">${esc(gt.label)}</text></g>`);   // 문 띠는 회전해도 화살표(+y)가 트랙 쪽(측문은 빈칸)을 본다
  const cap = (x, y, txt, anchor = 'middle') => `<text class="zcap" x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}">${esc(txt)}</text>`;   // 구역 이름표
  [['hq', 1], ['photo', -1]].forEach(([z, dir]) => { const list = boothsIn(z); if(!list.length) return; const a = pos[list[0].id], b = pos[list[list.length - 1].id]; const f = g.band.mid.frame((a.ta + b.tb) / 2); s += cap(f.x, f.y + g.band.h / 2 + 16, `${zoneOf(z).name.split('·')[1].trim()} ${list.length}`); });
  ['goalL', 'goalR'].forEach(z => { const list = boothsIn(z); if(!list.length) return; const c = g.cols[z]; s += cap(c.x, g.colY0(list.length) - 38, zoneOf(z).name); });
  { const list = boothsIn('bus'); if(list.length){ const p = pos[list[list.length - 1].id], a = (p.rot || 0) * Math.PI / 180, ox = Math.sin(a), oy = -Math.cos(a);   // 맨 바깥 버스에서 바깥쪽(법선)으로
      const name = zoneOf('bus').name, off = p.h / 2 + 14 + Math.abs(Math.sin(a)) * textW(name, 13) / 2;                                               // 기울어진 모서리·가로 글자 끝이 안 닿게
      s += cap(p.x + ox * off, p.y + oy * off, name); } }   // 버스 바깥 구역 이름표
  s += `<g id="routeLayer"></g>`;
  const visible = new Set(filteredBooths().map(b => b.id));
  S.booths.forEach(b => {
    const p = pos[b.id]; if(!p) return; const vb = bv(b), c = catOf(vb.cat);   // 전환 후 분류 색·운영 상태(variant hours 비우면 종일)
    const cls = `tile ${visible.has(b.id) ? '' : 'dim'} ${boothOpen(vb) ? '' : 'off'} ${done.has(b.id) ? 'done' : ''} ${S.focus === b.id ? 'hi' : ''}`;
    if(p.bus){                                                                                                             // 측1문 밖 버스: 창문 3개 + 바퀴 2개
      const bx = p.x - p.w / 2, by = p.y - p.h / 2;
      s += `<g class="${cls}" data-id="${esc(b.id)}" data-x="${p.x.toFixed(0)}" data-y="${p.y.toFixed(0)}" transform="rotate(${(p.rot || 0).toFixed(1)} ${p.x.toFixed(1)} ${p.y.toFixed(1)})"><rect class="bg" x="${bx}" y="${by}" width="${p.w}" height="${p.h}" rx="12" fill="${c.color}" stroke="#fff" stroke-width="2"/>
        ${[0, 1, 2].map(k => `<rect x="${bx + 10 + k * 28}" y="${by + 7}" width="20" height="12" rx="3" fill="rgba(255,255,255,.88)"/>`).join('')}
        <circle cx="${bx + 22}" cy="${by + p.h}" r="6" fill="var(--ink)" stroke="#fff" stroke-width="2"/><circle cx="${bx + p.w - 22}" cy="${by + p.h}" r="6" fill="var(--ink)" stroke="#fff" stroke-width="2"/>
        <text class="num" x="${p.x}" y="${by + 31}" font-size="15">${esc(bn(bv(b)))}</text></g>`;
      return;
    }
    if(p.rect){                                                                                                            // 골대 뒤 열: 둥근 네모
      s += `<g class="${cls}" data-id="${esc(b.id)}" data-x="${p.x.toFixed(0)}" data-y="${p.y.toFixed(0)}"><rect class="bg" x="${p.x - p.w / 2}" y="${p.y - p.h / 2}" width="${p.w}" height="${p.h}" rx="9" fill="${c.color}" stroke="#fff" stroke-width="2"/>
        <text class="num" x="${p.x}" y="${p.y}" font-size="15">${esc(bn(bv(b)))}</text></g>`;
      return;
    }
    const fs = Math.max(10, Math.min(18, p.segW * .42));
    s += `<g class="${cls}" data-id="${esc(b.id)}" data-x="${p.x.toFixed(0)}" data-y="${p.y.toFixed(0)}">
      <path class="bg" d="${segPath(p.band, p.ta, p.tb)}" fill="${c.color}" stroke="#fff" stroke-width="2"/>
      <text class="num" x="${p.x.toFixed(1)}" y="${p.y.toFixed(1)}" font-size="${fs.toFixed(1)}">${esc(bn(bv(b)))}</text></g>`;
  });
  s += `<g id="lblLayer"></g>`;
  s += `</g></svg>`;
  return s;
}
/* 드래그 경계: 지도가 화면 밖으로 완전히 나가지 못하게. 보이는 영역(검색바·탭바 뺀 부분) 안에 지도가 최소 40% 는 남아 있어야 함 */
function clampView(){

    const t = setTimeout(() => { if(!done){ done = true; el.remove(); no(new Error('timeout ' + src)); } }, timeoutMs);
    el.onload = () => { if(!done){ done = true; clearTimeout(t); check() ? ok() : no(new Error('bad ' + src)); } };
    el.onerror = () => { if(!done){ done = true; clearTimeout(t); el.remove(); no(new Error('fail ' + src)); } };
    document.head.appendChild(el); });
  _libs[key] = urls.reduce((p, u) => p.catch(() => tryOne(u)), Promise.reject()).catch(e => { delete _libs[key]; throw e; });
  return _libs[key];
}

/* 현황 부스별 표: 정렬 상태는 탭을 다시 열어도 유지. 번호 정렬은 숫자 → 문자(본1·네1) 순 */
const admBoothSort = { k: 'n', dir: 'desc' };
function admBoothTable(rows, maxB){
  const { k, dir } = admBoothSort, sg = dir === 'asc' ? 1 : -1;
  const numKey = b => { const m = String(b.n).match(/^\d+$/); return m ? [0, +b.n, ''] : [1, 0, String(b.n)]; };
  const cmp = (a, b) => { if(k === 'num'){ const x = numKey(a.b), y = numKey(b.b); return (x[0] - y[0]) || (x[1] - y[1]) || x[2].localeCompare(y[2], 'ko'); } if(k === 'org') return String(a.b.org || '').localeCompare(String(b.b.org || ''), 'ko'); if(k === 'last') return (a.last || 0) - (b.last || 0); return a.n - b.n; };
  const list = [...rows].sort((a, b) => cmp(a, b) * sg || (b.n - a.n));
  const tbl = $('#admBoothTbl'); if(!tbl) return;
  tbl.querySelector('tbody').innerHTML = list.map((r, i) => { const c = catOf(r.b.cat); return `<tr class="rowbtn" data-bv="${esc(r.b.id)}" tabindex="0"><td class="muted">${i + 1}</td><td><span class="pill" style="background:${c.color}1a;color:${c.color}"><span class="dot"></span>${esc(r.b.n)}</span> <b>${esc(r.b.name)}</b></td><td class="muted">${esc(r.b.org)}</td><td class="num">${r.n}</td><td><div class="bar"><i style="width:${r.n / maxB * 100}%"></i></div></td><td class="muted">${r.last ? fmtTime(r.last) : '—'}</td></tr>`; }).join('');
  $$('th.sortable', tbl).forEach(th => { th.classList.toggle('on', th.dataset.k === k); th.dataset.dir = th.dataset.k === k ? dir : ''; th.onclick = () => { if(admBoothSort.k === th.dataset.k) admBoothSort.dir = admBoothSort.dir === 'asc' ? 'desc' : 'asc'; else { admBoothSort.k = th.dataset.k; admBoothSort.dir = th.dataset.k === 'num' || th.dataset.k === 'org' ? 'asc' : 'desc'; } admBoothTable(rows, maxB); }; });
  $$('[data-bv]', tbl).forEach(tr => { const open = () => admBoothVisitors(tr.dataset.bv); tr.onclick = open; tr.onkeydown = e => { if(e.key === 'Enter') open(); }; });

      </div>`);
    $('#mScan').onclick = pickScan;
    $$('[data-pick]').forEach(c => c.onclick = () => go(admPath('/manual/' + encodeURIComponent(c.dataset.pick)), true));
    return;
  }
  sessionStorage.setItem(KEY, cur.n);
  admShell('manual', `
    <div class="tb-head"><div class="bn">${esc(cur.n)}</div><div class="grow"><div class="bsub">이 태블릿은</div><div class="bname" id="mCur">${esc(cur.n)}번 · ${esc(cur.name)}</div></div><button class="chg" id="mChange">부스 바꾸기</button></div>
    <div class="card" id="mPanel" style="margin-top:14px"></div>`);
  $('#mChange').onclick = () => { sessionStorage.removeItem(KEY); go(admPath('/manual'), true); };
  const panel = $('#mPanel');
  const vinfo = v => vCols().map(c => c.get(v)).filter(Boolean).join(' · ');
  /* 부스 칸: 도장 받은 부스는 노랑, 이 부스는 테두리. ids = 그 아이가 도장 받은 부스 id 목록(null 이면 아직 불러오는 중) */
  const boothRow = (ids, big) => `<div class="bprog ${big ? 'big' : ''} ${ids ? '' : 'wait'}">${booths.map(b => `<span class="${ids && ids.includes(b.id) ? 'on' : ''} ${b.id === cur.id ? 'me' : ''}" title="${esc(b.name)}">${esc(b.n)}</span>`).join('')}</div>`;
  const vcard = (v, extra) => `<div class="vcard" data-v="${v.id}"><div class="av">${esc(v.name.slice(0, 1))}</div><div class="grow"><div class="nm">${esc(v.name)}</div><div class="meta">${vinfo(v) ? `<span>${esc(vinfo(v))}</span>` : ''}<span class="st">도장 ${v.n}/${goal}</span>${extra ? `<span>${esc(extra)}</span>` : ''}</div>${boothRow(v.boothIds || null)}</div><button class="go" data-stamp="${v.id}">도장</button></div>`;
  const wireStamp = (sel, rows) => { $$(sel + ' [data-stamp]').forEach(btn => btn.onclick = () => { btn.disabled = true; doStamp(rows.find(x => x.id === btn.dataset.stamp)); }); fillStamps(sel, rows); };
  /* 각 아이의 도장 부스를 서버에서 받아(visitor_stamps, 1분 캐시) 카드 칸을 채우고, 이 부스에 이미 있으면 버튼을 '이미 찍음'으로 */
  const stampCache = new Map();
  const stampsOf = async id => { const c = stampCache.get(id); if(c && Date.now() - c.at < 60000) return c.ids; const ids = (await DB.stampsOf(id)).map(s => s.boothId); stampCache.set(id, { ids, at: Date.now() }); return ids; };
  const fillStamps = (sel, rows) => rows.forEach(async v => {
    let ids; try{ ids = await stampsOf(v.id); }catch(e){ return; }
    v.boothIds = ids; v.n = ids.length;
    const card = $(sel + ` .vcard[data-v="${v.id}"]`); if(!card) return;
    card.querySelector('.bprog').outerHTML = boothRow(ids); card.querySelector('.st').textContent = `도장 ${ids.length}/${goal}`;
    if(ids.includes(cur.id)){ const b = card.querySelector('[data-stamp]'); b.textContent = '이미 찍음'; b.classList.add('done'); b.disabled = true; }
  });
  /* 찾기 화면: 두 글자(또는 번호 한 글자)부터 자동 검색(350ms). 결과 카드 = 이름·항목·번호표·도장 수 + [도장] */
  const showSearch = () => {
    panel.innerHTML = `
      <div class="tb-q">누구에게 ${esc(cur.n)}번 도장을 찍을까요?</div>
      <div class="tb-search" id="mBox"><span class="ic">${I.search}</span><input class="inp" id="mq" placeholder="아이 이름" autocomplete="off"><button class="clr" id="mClr" aria-label="지우기">×</button></div>
      <div class="tb-hint">두 글자만 치면 나와요 · 같은 이름은 소속·나이로 구분 · 처음 온 어린이는 맨 아래 버튼</div>
      <div id="mRes"></div>
      <div id="mRecent"></div>
      <button class="tb-new" id="mNew">＋ 처음 왔어요 · 새로 등록하고 도장</button>`;
    const inp = $('#mq'); let timer, seq = 0;
    const search = async () => {
      const q = inp.value.trim(); $('#mBox').classList.toggle('has', !!q);
      $('#mRecent').hidden = !!q;   // 검색 중엔 최근 목록 숨김
      if(q.length < 2){ $('#mRes').innerHTML = q ? '<div class="small muted" style="padding:8px 2px">두 글자 이상 적어주세요</div>' : ''; return; }
      const my = ++seq; $('#mRes').innerHTML = '<div class="empty">찾는 중…</div>';
      let rows; try{ rows = await DB.findVisitor(q); }catch(e){ if(my === seq) $('#mRes').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
      if(my !== seq) return;
      $('#mRes').innerHTML = rows.length ? rows.map(vcard).join('') : '<div class="empty">없어요. 처음 왔으면 아래 [새로 등록]을 눌러주세요</div>';
      wireStamp('#mRes', rows);
    };
    /* 방금 다른 부스에서 도장 찍은 아이들(10분) — 이름 안 치고 탭 한 번. 20초마다 갱신, 이 화면을 벗어나면 멈춤 */
    const recent = async () => {
      const box = $('#mRecent'); if(!box) return;
      let r = { list: [], counts: {} }; try{ r = await DB.recentVisitors(cur.id, booths.filter(b => b.id !== cur.id).map(b => b.id)); }catch(e){}
      const box2 = $('#mRecent'); if(!box2 || box2 !== box) return;
      const rows = r.list;
      box.innerHTML = (rows.length ? `<div class="tb-sec">방금 다른 부스에서 도장 찍은 아이들 <span class="muted small" style="font-weight:600">· 탭 한 번이면 도장</span></div>${rows.map(v => vcard(v, `${fmtTime(v.stampedAt)} 도장`)).join('')}` : '<div class="small muted" style="padding:6px 2px">최근 10분 안에 다른 부스에서 도장 찍은 아이가 없어요</div>');
      wireStamp('#mRecent', rows);
    };
    recent(); const rt = setInterval(() => { if($('#mRecent')) recent(); else clearInterval(rt); }, 20000);
    inp.oninput = () => { const r = $('#mRecent'); if(r) r.hidden = !!inp.value.trim(); clearTimeout(timer); timer = setTimeout(search, 350); };   // 치기 시작하면 최근 목록은 바로 숨김
    inp.addEventListener('focus', () => { clearInterval(rt); });   // 자판이 올라오면 갱신으로 목록이 흔들리지 않게
    inp.onkeydown = e => { if(e.key === 'Enter'){ clearTimeout(timer); search(); } };
    $('#mClr').onclick = () => { inp.value = ''; search(); inp.focus(); };
    $('#mNew').onclick = showNew;
    setTimeout(() => inp.focus(), 50);
  };
  /* 도장 → 확인 화면(번호표 크게·도장 칸 진행). 완주면 confetti. 5초 뒤(또는 [다음]) 찾기 화면으로 */
  const doStamp = async (v, fresh) => {
    let r; try{ r = await DB.adminAddStamp(v.id, cur.id); }catch(e){ toast(e.message); return showSearch(); }
    stampCache.delete(v.id); let ids = null; try{ ids = await stampsOf(v.id); }catch(e){}
    const n = ids ? ids.length : (v.n || 0) + (r.dup ? 0 : 1), done = n >= goal;
    if(done && !r.dup) confetti();
    panel.innerHTML = `<div class="tb-done" id="mDone">
      <div class="bigstamp ${r.dup ? 'dup' : ''}" style="width:160px;height:160px"><div><div class="n">${esc(cur.n)}</div><div class="t">${r.dup ? '이미 찍었어요' : '도장 완료'}</div></div></div>
      <div><div class="stamp-h">${esc(v.name)}${fresh ? ' 등록 완료' : ''} · 도장 ${n}/${goal}${done ? ' 완주! 🎉' : ''}</div>${boothRow(ids || [cur.id], true)}<div class="small muted" style="margin-top:6px">노란 칸 = 받은 부스</div></div>
      ${fresh ? '<p class="stamp-p">다음 부스에서는 이름만 말하면 돼요</p>' : ''}
      ${done ? '<p class="stamp-p">운영본부에서 선물을 받아가세요</p>' : ''}
      <button class="btn blue full" style="max-width:340px;font-size:16px;padding:15px" id="mNext">다음 어린이</button>
      <div class="small muted" id="mCnt">5초 뒤 자동으로 넘어가요</div></div>`;
    let left = 5; const t = setInterval(() => { const c = $('#mCnt'); if(!c) return clearInterval(t); if(--left <= 0){ clearInterval(t); showSearch(); } else c.textContent = `${left}초 뒤 자동으로 넘어가요`; }, 1000);
    $('#mNext').onclick = () => { clearInterval(t); showSearch(); };
  };
  /* 처음 온 어린이: 등록 항목(행사 설정에서 켠 것) + 이름 → 등록하고 바로 도장 */
  const showNew = () => {
    panel.innerHTML = `
      <div class="tb-q">처음 온 어린이 등록</div>
      <div class="tb-form">
        <div class="field full"><label>이름</label><input class="inp" id="nName" placeholder="홍길동" maxlength="20" autocomplete="off"></div>
        ${regFieldsHTML('n')}
      </div>
      <div class="row" style="gap:8px;margin-top:14px"><button class="btn blue grow" id="nGo" style="font-size:16px;padding:15px">등록하고 ${esc(cur.n)}번 도장</button><button class="btn line" id="nBack" style="padding:15px 18px">뒤로</button></div>`;
    $('#nBack').onclick = showSearch;
    setTimeout(() => { const el = $('#nName'); if(el) el.focus(); }, 50);   // 50ms 안에 화면이 바뀌었을 수 있음
    $('#nGo').onclick = async () => {
      const name = $('#nName').value.trim(); if(!name) return toast('이름을 적어주세요'), $('#nName').focus();
      const f = readRegFields('n'); if(f.err) return toast(f.err), $(f.focus).focus();
      $('#nGo').disabled = true;
      /* 같은 이름이 이미 있으면(최근 등록 포함) 먼저 보여줌 — 같은 아이를 두 번 등록하는 실수 방지. 소속까지 같으면 맨 위 */
      if(!$('#nGo').dataset.force){
        let same = []; try{ same = (await DB.findVisitor(name)).filter(v => v.name === name); }catch(e){}
        if(same.length){
          same.sort((a, b) => ((b.school || '') === f.school) - ((a.school || '') === f.school));
          const sameOrg = same.some(v => (v.school || '') === f.school && f.school);
          panel.innerHTML = `
            <div class="tb-q">같은 이름이 이미 있어요</div>
            <div class="tb-hint" style="margin:0 0 6px">${sameOrg ? `<b style="color:var(--coral)">소속까지 같은 아이가 있어요.</b> 방금 다른 부스에서 등록했을 수 있어요. ` : ''}이 아이가 맞으면 [이 아이예요]를 누르세요. 도장 칸을 보면 어느 부스를 돌았는지 알 수 있어요.</div>
            <div id="mSame">${same.map(v => vcard(v, `${fmtTime(v.createdAt)} 등록`)).join('')}</div>
            <div class="row" style="gap:8px;margin-top:14px"><button class="btn blue grow" id="nForce" style="font-size:15px;padding:14px">다른 아이예요 · ${esc(name)} 새로 등록</button><button class="btn line" id="nBack2" style="padding:14px 18px">뒤로</button></div>`;
          $$('#mSame [data-stamp]').forEach(b => b.textContent = '이 아이예요 · 도장');
          wireStamp('#mSame', same);
          $('#nBack2').onclick = () => { showNew(); setTimeout(() => { $('#nName').value = name; regFields().forEach(x => { const el = $('#n' + x.k); if(el) el.value = f[x.col] || ''; }); }, 0); };
          $('#nForce').onclick = async () => { $('#nForce').disabled = true; try{ const v = await DB.createVisitor({ name, school: f.school, grade: f.grade, gender: f.gender }); doStamp({ ...v, n: 0 }, true); }catch(e){ $('#nForce').disabled = false; toast('등록에 실패했어요. 다시 눌러주세요'); } };
          return;
        }
      }
      try{ const v = await DB.createVisitor({ name, school: f.school, grade: f.grade, gender: f.gender }); doStamp({ ...v, n: 0 }, true); }
      catch(e){ $('#nGo').disabled = false; toast('등록에 실패했어요. 다시 눌러주세요'); }
    };
  };
  showSearch();
}
/* 부스 편집 목록(카드 한 줄 = 부스 하나, .brow[data-i]). 칸 편집 → [변경사항 저장] 때 collect() 로 모아 DB.saveBooths. CSV 내려받기/불러오기(9열). 영상·PDF·사진은 [편집] 시트(openMediaSheet)에서, 파일 업로드는 uploadFile */
function admBooths(){
  admShell('booths', `
    <div class="row" style="flex-wrap:wrap;gap:8px">
      <button class="btn sm" id="bAdd">+ 부스 추가</button>
      <button class="btn sm line" id="bXlsx">엑셀 양식 내려받기</button>
      <label class="btn sm line" style="cursor:pointer">엑셀·CSV 불러오기<input type="file" accept=".xlsx,.csv,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" id="bImp" hidden></label>
      <button class="btn xs soft" id="bCsv" title="예전 방식">CSV</button>
      <button class="btn sm line" id="bSort" title="표 순서를 부스 번호 순으로">번호순 정렬</button>
      <button class="btn sm line" id="bStatus" title="쉬는 부스를 한 화면에서 고르기">운영 상태</button>
      <button class="btn sm line" id="bNoStamp" title="QR 안 하는(도장 없는) 부스 고르기">QR 제외</button>
      <button class="btn sm line" id="bColors" title="분류별 색 바꾸기 (홈 칩·지도·QR 인쇄물에 반영)">분류 색</button>
      <span class="small muted">${S.booths.length}/${CONFIG.boothMax}개 · 같은 구역 안에서는 표 순서가 지도 순서예요 (트랙 둘레는 정문 오른쪽부터 시계방향) · 왼쪽 ≡ 를 끌어서 순서를 바꿔요<br>분류: ${esc(CATS.map(c => c.name).join(' / '))} — 일부만 적어도 알아듣고, 없는 이름을 적으면 새 분류가 생겨요</span>
    </div>
    <div class="blist" id="bList">
      ${S.booths.map((b, i) => `<div class="brow" data-i="${i}">
        <div class="drag" data-drag="${i}" title="끌어서 순서 바꾸기">≡</div>
        <div class="l1">
          <input class="inp sm f-n" value="${esc(b.n)}" data-f="n" placeholder="번호" title="부스 번호">
          <input class="inp sm f-name" value="${esc(b.name)}" data-f="name" placeholder="부스명">
          <input class="inp sm f-org" value="${esc(b.org)}" data-f="org" placeholder="운영기관">
          <div class="acts">
            <input type="hidden" data-f="video" value="${esc(b.video || '')}"><input type="hidden" data-f="pdf" value="${esc(b.pdf || '')}"><input type="hidden" data-f="img" value="${esc(b.img || '')}">
            <span class="mchip ${b.video ? 'on' : ''}" data-m="video">▶ 영상</span><span class="mchip ${b.pdf ? 'on' : ''}" data-m="pdf">PDF</span><span class="mchip ${b.img ? 'on' : ''}" data-m="img">사진</span>
            <button class="btn xs soft" data-media="${i}" style="white-space:nowrap">편집</button>
            <button class="btn xs line" data-del="${i}" style="color:var(--coral);white-space:nowrap">삭제</button></div></div>
        <div class="l2">
          <input class="inp sm f-cat" value="${esc(b.catTxt || catOf(b.cat).name)}" data-f="cat" placeholder="분류" title="없는 이름을 적으면 새 분류가 생겨요">
          <select class="inp sm f-zone" data-f="zone" title="구역">${ZONES.map(z => `<option value="${z.id}" ${z.id === (b.zone || '') ? 'selected' : ''}>${z.name}</option>`).join('')}</select>
          <input type="hidden" data-f="target" value="${esc(b.target || '')}"><div class="tsel" data-tsel="${i}" title="대상: 초등 이하로 두면 중고등학생 폰에는 안 보이고 도장도 안 찍혀요">${TARGETS.map(t => `<button type="button" class="${(b.target || '') === t.id ? 'on' : ''}" data-t="${t.id}">${t.name}</button>`).join('')}</div>
          <input type="hidden" data-f="hours" value="${esc(b.hours || '')}"><input type="hidden" data-f="variant" value="${esc(b.variant ? JSON.stringify(b.variant) : '')}">
          <span class="mchip ${b.hours ? 'on' : ''}" data-m="hours">🕒 ${esc(b.hours || '종일')}</span><span class="mchip ${b.variant ? 'on' : ''}" data-m="variant">🔁 ${b.variant ? esc(b.variant.at) + ' 전환' + (b.variant.n ? ' · 번호 ' + esc(b.variant.n) : '') + (b.variant.media ? ' · 자료 별도' : '') + (b.variant.stamp === 'yes' ? ' · 도장 있음' : b.variant.stamp === 'no' ? ' · 도장 없음' : '') : '전환 없음'}</span><button class="btn xs soft" data-time="${i}" style="white-space:nowrap" title="운영 시간 · 시간대 전환">시간</button>
          <input class="inp sm f-desc" value="${esc(b.desc || '')}" data-f="desc" placeholder="소개 (방문객 부스 소개 화면에 나와요)"></div></div>`).join('')}
    </div>
    <div class="row no-print"><button class="btn blue" id="bSave">변경사항 저장</button><span class="small muted">저장 전엔 지도에 반영되지 않아요</span></div>`);
  /* 분류는 글자 입력. 있는 이름(일부만 써도 됨)이면 그걸로, 없는 이름이면 새 분류가 생김. 구역은 드롭다운 */
  const collect = (create = false) => S.booths.map((b, i) => { const tr = $(`.brow[data-i="${i}"]`); const o = { ...b }; $$('[data-f]', tr).forEach(el => { const v = el.value.trim(); o[el.dataset.f] = el.dataset.f === 'cat' ? matchCategory(v, b.cat, create) : el.dataset.f === 'variant' ? (() => { try{ return v ? JSON.parse(v) : null; }catch(e){ return null; } })() : v;
    if(el.dataset.f === 'cat'){ delete o.catTxt; if(!create && v && !matchCategory(v, null, false)) o.catTxt = v; } }); return o; });   // 새 분류는 저장(create=true) 때만 생김. 그 전엔 적은 글자를 catTxt 로 들고 있다가 다시 보여줌
  /* 부스 저장 뒤 사용자 정의 분류를 settings 에 같이 저장. 아무 부스도 안 쓰는 사용자 정의 분류는 정리 */
  const saveCategories = async list => {
    const used = new Set(list.flatMap(b => [b.cat, b.variant && b.variant.cat].filter(Boolean)));
    for(let i = CATS.length - 1; i >= 0; i--) if(CATS[i].custom && !used.has(CATS[i].id)) CATS.splice(i, 1);
    const cats = CATS.filter(c => c.custom).map(c => ({ id: c.id, name: c.name, color: c.color }));
    const raw = S.settingsRaw || {}, patch = { categories: cats }; let changed = JSON.stringify(raw.categories || []) !== JSON.stringify(cats);
    const ids = new Set(list.map(b => b.id));   // 삭제된 부스 id 가 쉬는 중·QR 제외 목록에 남아 개수가 안 맞던 문제
    for(const k of ['closedBooths', 'noStampBooths']){ const a = raw[k]; if(Array.isArray(a)){ const f = a.filter(id => ids.has(id)); if(f.length !== a.length){ patch[k] = f; changed = true; } } }
    if(changed) await savePatch(patch);
  };
  $('#bSave').onclick = async () => { const seen = new Set(); for(const b of collect()){ if(!b.n || !b.name) return toast('번호와 이름은 비울 수 없어요'); if(!validN(b.n)) return toast(`${N_MSG} (${b.n})`); if(seen.has(normN(b.n))) return toast(`부스 번호 ${b.n}이(가) 중복돼요`); seen.add(normN(b.n)); } const list = collect(true); /* 검증 통과 뒤에만 새 분류 생성 */
    const bt = $('#bSave'); bt.disabled = true;

/* 부스 운영 상태: settings.closedBooths(id 목록) 에 있으면 '쉬는 중'. 운영 시간 밖(hoursState before/after)도 흐리게. 도장은 막지 않음 */
function closedSet(){ return new Set((S.settingsRaw && S.settingsRaw.closedBooths) || []); }
/* 도장 없는 부스(QR 안 하는 체험·안내 부스): settings.noStampBooths(id 목록). QR 인쇄에서 빠지고, 방문객에겐 '도장 없음' 표시·도장 화면에서 막음 */
function noStampSet(){ return new Set((S.settingsRaw && S.settingsRaw.noStampBooths) || []); }
function hasStamp(b){ if(!b) return false; if(b.stamp === 'yes') return true; if(b.stamp === 'no') return false; return !noStampSet().has(b.id); }
/* QR 인쇄 대상: 카드가 도장 부스거나, 전환 후에 도장 있음으로 바뀌는 부스(오전 본부 → 오후 체험 부스). 원본 S.booths(전환 안 거친 것) 기준 */

/* QR 인쇄 시트. 부스별 QR 주소 = base?b=번호&t=토큰. 토큰은 DB.boothTokens (부스가 서버에 없으면 먼저 저장해 발급). 같은 탭의 테스트 번호 입력도 통과되게 qrTok 에 넣음 */

      $('#qrStatus').innerHTML = `<span style="color:var(--coral)">저장 안 한 부스 변경이 있어요. 부스 탭에서 [변경사항 저장] 후 다시 열어주세요.</span> <button class="btn xs sun" data-go="${esc(admPath('/booths'))}">부스 탭으로</button>`;

    for(const q of list){ if(!q.title) return toast('질문이 비어 있는 문항이 있어요'); if((q.type === 'single' || q.type === 'multi') && q.opts.length < 2) return toast(`'${q.title}' 보기를 2개 이상 적어주세요`); }
    const ids = new Set(); for(const q of list){ if(ids.has(q.id)) q.id = q.id + '_' + Math.random().toString(36).slice(2, 5); ids.add(q.id); }
    $('#sqSave').disabled = true;
    try{ await savePatch({ survey: list.map(q => ({ id: q.id, type: q.type, title: q.title, sub: q.sub || '', required: !!q.required, ...(q.type === 'single' || q.type === 'multi' ? { opts: q.opts } : {}) })) }); toast('저장했어요'); admSurvey(); }
    catch(e){ $('#sqSave').disabled = false; toast('저장 실패: ' + (e.message || '통신 오류')); }
  };
  let rows = null;
  const load = async () => { $('#sqRes').innerHTML = '<div class="empty">불러오는 중…</div>'; try{ rows = await DB.surveyAnswers(); }catch(e){ $('#sqRes').innerHTML = `<div class="empty">${esc(e.message)}${/PGRST202|admin_survey_answers/.test(e.message) ? '<br>SQL 9절(앱 내 설문)을 실행해주세요' : ''}</div>`; return; } drawResults(); };
  const drawResults = () => {
    if(!rows.length){ $('#sqRes').innerHTML = '<div class="empty">아직 응답이 없어요</div>'; return; }
    const bars = (pairs, total) => { const max = Math.max(1, ...pairs.map(p => p[1])); return `<div class="sv-res">${pairs.map(([k, v]) => `<div class="r"><div>${esc(k)}</div><div class="bar"><i style="width:${v / max * 100}%"></i></div><div class="v">${v}<small class="muted" style="font-weight:400"> ${total ? Math.round(v / total * 100) : 0}%</small></div></div>`).join('')}</div>`; };
    $('#sqRes').innerHTML = `<div class="small muted" style="margin-bottom:4px">응답 <b>${rows.length}</b>명 · 나이대별 ${Object.entries(rows.reduce((m, r) => { const g = gradeGroup(r.grade) || '미입력'; m[g] = (m[g] || 0) + 1; return m; }, {})).map(([k, v]) => `${k} ${v}`).join(' · ')}</div>` + SURVEY.map((q, i) => {
      const vals = rows.map(r => r.answers?.[q.id]).filter(v => v !== undefined && v !== null && v !== '');
      let body = '';
      if(q.type === 'scale'){ const cnt = [1, 2, 3, 4, 5].map(k => [SV_FACES[k - 1] + ' ' + k, vals.filter(v => +v === k).length]); const avg = vals.length ? (vals.reduce((a, v) => a + +v, 0) / vals.length).toFixed(2) : '-'; body = `<div class="small" style="margin-bottom:6px">평균 <b style="font-size:18px">${avg}</b> / 5</div>` + bars(cnt, vals.length); }
      else if(q.type === 'single'){ const m = {}; vals.forEach(v => m[v] = (m[v] || 0) + 1); body = bars((q.opts || []).map(o => [o, m[o] || 0]).concat(Object.keys(m).filter(k => !(q.opts || []).includes(k)).map(k => [k, m[k]])), vals.length); }
      else if(q.type === 'multi'){ const m = {}; vals.forEach(v => [].concat(v).forEach(x => m[x] = (m[x] || 0) + 1)); body = bars((q.opts || []).map(o => [o, m[o] || 0]).concat(Object.keys(m).filter(k => !(q.opts || []).includes(k)).map(k => [k, m[k]])), vals.length); }
      else if(q.type === 'booth'){ const m = {}; vals.forEach(v => m[v] = (m[v] || 0) + 1); body = bars(Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, 10).map(([n, c]) => [`${n} ${boothByN(n)?.name || ''}`, c]), vals.length); }
      else body = vals.length ? `<div style="display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto">${vals.slice(-50).reverse().map(v => `<div class="sv-txt">${esc(v)}</div>`).join('')}</div>` : '';
      return `<div class="card tight"><div class="small muted">Q${i + 1} · ${SV_TYPES[q.type]} · 응답 ${vals.length}</div><b style="display:block;margin:2px 0 8px">${esc(q.title)}</b>${body || '<div class="empty">응답 없음</div>'}</div>`;
    }).join('');
  };
  $('#sqLoad').onclick = load;
  $('#sqCsv').onclick = async () => { if(!rows){ await load(); if(!rows) return; } download('survey.csv', '\ufeff' + [['제출시각', ...vCols().map(c => c.label), '나이대', ...SURVEY.map(q => q.title)]].concat(rows.map(r => [new Date(r.at).toLocaleString('ko-KR'), ...vCols().map(c => c.get(r)), gradeGroup(r.grade), ...SURVEY.map(q => { const v = r.answers?.[q.id]; return Array.isArray(v) ? v.join(' | ') : (v ?? ''); })])).map(r => r.map(csv).join(',')).join('\n')); };
}
/* 데이터: CSV 내보내기 3종(스탬프·명단·부스별 집계), 비번 변경, 부스 기본값 복원, 데모 데이터(로컬), 개인정보 파기 */
function admData(st){

          <button class="btn sm soft" id="setPwGo">바꾸기</button>
          <div class="field" style="margin-top:14px"><label>부스 목록</label><button class="btn sm line" id="boothReset">기본 배치도(90개)로 되돌리기</button></div>
          <p class="small muted" style="margin-top:12px;line-height:1.6">행사명·일시·완주 개수·설문 링크·일정·자료는 <b>행사 설정</b> 탭에서, Supabase 연결은 파일 상단 <code>CONFIG</code>에서 바꿔요.<br>현재 저장소: <b>${local ? '브라우저 로컬 (이 기기에만 저장)' : 'Supabase'}</b></p></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:14px">
        ${local ? `<div class="card"><div class="h-sec" style="margin:0 0 10px">데모</div><p class="small muted" style="line-height:1.6;margin-bottom:12px">화면 확인용 가짜 방문객 180명과 스탬프를 만들어요. 기존 기록은 지워져요.</p><button class="btn sm line" id="demoGo">데모 데이터 만들기</button></div>` : ''}
        <div class="dz"><div class="t">개인정보 파기</div><p>방문객 ${visitors.length}명, 스탬프 ${stamps.length}개를 모두 삭제해요. 행사 종료 후 보고서를 뽑은 다음 실행하세요. 되돌릴 수 없어요.</p>
          <button class="btn sm" style="background:var(--coral);margin-top:12px" id="purgeGo">전부 삭제</button></div>
      </div>
    </div>`);
  const fetchAll = async () => { toast('내보낼 데이터를 모으는 중…'); const [stamps, visitors] = await Promise.all([DB.allStamps(), DB.allVisitors()]); return { stamps, visitors, vmap: Object.fromEntries(visitors.map(v => [v.id, v])) }; };
  $('#exStamps').onclick = async () => { const { stamps, vmap } = await fetchAll(); download('stamps.csv', '\ufeff' + [['시각', '부스번호', '부스명', '이름', ...vCols().map(c => c.label)]].concat(stamps.slice().sort((a, b) => a.at - b.at).map(s => { const b = boothById(s.boothId), v = vmap[s.visitorId]; return [new Date(s.at).toLocaleString('ko-KR'), b?.n || '', b?.name || '', v?.name || '', ...vCols().map(c => c.get(v))]; })).map(r => r.map(csv).join(',')).join('\n')); };
  $('#exVisitors').onclick = async () => { const { stamps, visitors } = await fetchAll(); const cnt = {}; stamps.forEach(s => cnt[s.visitorId] = (cnt[s.visitorId] || 0) + 1); download('visitors.csv', '\ufeff' + [['등록시각', '이름', ...vCols().map(c => c.label), '나이대', '스탬프수', '설문완료', '선물수령']].concat(visitors.map(v => [new Date(v.createdAt).toLocaleString('ko-KR'), v.name, ...vCols().map(c => c.get(v)), gradeGroup(v.grade), cnt[v.id] || 0, v.surveyAt ? new Date(v.surveyAt).toLocaleString('ko-KR') : '', v.giftAt ? new Date(v.giftAt).toLocaleString('ko-KR') : ''])).map(r => r.map(csv).join(',')).join('\n')); };
  $('#exSummary').onclick = () => { const cnt = {}; Object.entries(st.perBooth).forEach(([k, v]) => cnt[k] = v.n); download('booth_summary.csv', '\ufeff' + [['부스번호', '부스명', '운영기관', '분류', '스탬프수']].concat(S.booths.map(b => [b.n, b.name, b.org, catOf(b.cat).name, cnt[b.id] || 0])).map(r => r.map(csv).join(',')).join('\n')); };
  $('#boothReset').onclick = async () => { if(!confirm('저장된 부스 목록을 지우고 파일에 든 기본 배치도(90 + 운영·네컷 5)로 되돌릴까요? 도장 기록은 그대로예요.')) return;

}
const csv = v => { v = String(v ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
function parseCSV(t){ const rows = [], re = /("([^"]|"")*"|[^,\n\r]*)(,|\r?\n|$)/g; let row = [], m; t = t.replace(/^\ufeff/, ''); if(!/\n$/.test(t)) t += '\n';   /* \ub9c8\uc9c0\ub9c9 \uce78\uc774 \ube44\uace0 \ub05d\uc5d0 \uc904\ubc14\uafc8\uc774 \uc5c6\uc73c\uba74 \ub9c8\uc9c0\ub9c9 \ud589\uc774 \ube60\uc9c0\ub358 \ubb38\uc81c */ while((m = re.exec(t)) && m[0] !== ''){ let f = m[1]; if(f.startsWith('"')) f = f.slice(1, -1).replace(/""/g, '"'); row.push(f.trim()); if(m[3] !== ','){ rows.push(row); row = []; } } return rows.filter(r => r.some(x => x)); }
function download(name, text){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }

/* =====================================================================
   BOOT — 부팅 순서
   1. 관리자 세션 복원 (sessionStorage 에 비번 있으면)
   2. 부스 목록 + 행사 설정 (병렬)
   3. 내 정보·내 도장 (store 'wj:me' 기준, 실패 시 캐시)
   4. 못 보낸 도장 재전송 시도
   5. QR 딥링크(?b=번호&t=토큰) 또는 입장 QR(?join) 을 해시 라우트로 바꾸고 route()
   ===================================================================== */
(async function boot(){
  $('#frame').innerHTML = `<main class="content"><div class="bootwait"><div class="spin"></div><div>불러오는 중…</div><div class="small" id="bootSlow" style="display:none">서버 응답이 느려요.<br>잠시 후 다시 열어주세요</div></div></main>`;   // 데이터 오기 전 흰 화면 방지
  const slowT = setTimeout(() => { const el = $('#bootSlow'); if(el) el.style.display = ''; }, 8000);
  if(DB === SupabaseDB && adminAuth.pw()) S.admin = true;   // 새로고침해도 관리자 유지 (탭 닫으면 사라짐). 비번이 바뀌었으면 첫 관리자 RPC 에서 로그아웃됨
  await Promise.all([loadSettings().then(loadBoothsCached), loadMe()]);   // 설정→부스(버전 의존)는 순서대로, 내 정보는 병렬
  S.swSig = S.booths.map(b => bv(b).switched ? 1 : 0).join('');   // 전환 시그니처를 지금 상태로 — 전환 시각 직전에 열면 첫 틱이 초기화로 먹혀 재그리기를 놓치던 문제
  clearTimeout(slowT);
  flushPending();
  // QR 딥링크: ?b=07&t=토큰 → 스탬프 화면. 토큰은 세션에 두고 주소창에서 쿼리는 지워서 새로고침 시 재진입을 막는다.
  const qs = new URLSearchParams(location.search); const b = qs.get('b');
  if(b){ qrTok.set(b, qs.get('t')); history.replaceState(null, '', location.pathname + '#/stamp/' + b); }
  else if(qs.has('join')){ history.replaceState(null, '', location.pathname + (S.me ? '#/' : '#/register')); }   // 안내판·포스터용 입장 QR
  else if(qs.has('survey')){ S.surveyReturn = true; history.replaceState(null, '', location.pathname + '#/my'); }   // 구글폼 확인 메시지의 복귀 링크 → 내 스탬프에서 자동 완료 처리 (미등록이면 등록/이어받기 뒤에)
  route();
})();
