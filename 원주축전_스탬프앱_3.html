        <button class="btn blue full" onclick="go('/survey')">📝 설문 참여하고 교환권 받기</button>` : `
        <p class="desc small" style="text-align:center;line-height:1.7;margin:0">① <b>설문 참여하기</b>로 설문을 마치고<br>② 돌아와서 <b>설문 다 했어요</b>를 눌러주세요.<br>교환권이 나오면 <b>운영본부</b>에서 선물을 받아요.</p>
        <button class="btn blue full" id="svOpen">📝 설문 참여하기</button>
        <button class="btn line full" id="svDone" disabled>설문 다 했어요</button>
        <p class="small muted" id="svHint" style="text-align:center;margin:0;min-height:1.4em"></p>`}
      </div>
    </div>`) : ''}
    <div class="h-sec">방문한 부스 <span class="muted small">${allStampsLocal().length}곳</span></div>
    ${S.pending.length ? `<div class="notice">${I.bell}<span>도장 ${S.pending.length}개가 아직 서버에 안 갔어요. 통신되면 자동 전송돼요. <b style="cursor:pointer" onclick="flushPending()">지금 보내기</b></span></div>` : ''}
    ${allStampsLocal().length ? `<div class="stamp-grid">${allStampsLocal().reverse().map(s => { const b = boothById(s.boothId); return `<div class="sg" onclick="go('/booth/${b?.n}')"><div class="n ${s.pending ? 'pend' : ''}">${esc(b?.n || '?')}</div><div class="t">${esc(b?.name || '')}</div><div class="tm">${s.pending ? '전송 대기' : fmtTime(s.at)}</div></div>`; }).join('')}</div>`
        : `<div class="empty"><b>아직 도장이 없어요</b>가까운 부스의 QR부터 찍어보세요</div><button class="btn full" onclick="go('/map')">${I.map} 지도 열기</button>`}`);
  if($('#myQr') && window.QRCode) new QRCode($('#myQr'), { text: 'WJ:' + S.me.id, width: 164, height: 164, correctLevel: QRCode.CorrectLevel.M });
  /* 자기신고 보강(A안): '설문 참여하기'를 누른 시각을 폰에 저장하고, surveyMinSec 초가 지나야 '다 했어요'가 켜진다.
     열어보지도 않고 누르기·열자마자 누르기를 막는 정도. 링크가 비어 있으면(설문 준비 전) 기다리지 않음 */
  const svOpen = $('#svOpen'), svDone = $('#svDone'), svHint = $('#svHint');
  if(svOpen){
    const minMs = (CONFIG.surveyUrl ? CONFIG.surveyMinSec : 0) * 1000;
    const tick = () => {
      if(!document.contains(svDone)) return clearInterval(S.svTimer);
      if(!S.surveyOpenAt){ svDone.disabled = true; svHint.textContent = '설문 참여하기를 먼저 눌러주세요'; return; }
      const left = Math.ceil((S.surveyOpenAt + minMs - Date.now()) / 1000);
      svOpen.textContent = '📝 설문 다시 열기';
      if(left > 0){ svDone.disabled = true; svHint.textContent = `설문 작성 중… ${left}초 뒤에 누를 수 있어요`; }
      else { svDone.disabled = false; svHint.textContent = '설문을 마쳤으면 눌러주세요'; clearInterval(S.svTimer); }
    };
    S.svTimer = setInterval(tick, 500); tick();
    svOpen.onclick = async () => {
      if(!S.surveyOpenAt){ S.surveyOpenAt = Date.now(); await store.set('wj:survey_open', S.surveyOpenAt); if(!S.svTimer) S.svTimer = setInterval(tick, 500); }
      const u = surveyLink(); if(u) window.open(u, '_blank', 'noopener'); else toast('설문 링크가 아직 준비 중이에요. 바로 다 했어요를 누를 수 있어요');
      tick();
    };
    svDone.onclick = async () => {
      if(!S.surveyOpenAt) return toast('먼저 설문 참여하기를 눌러주세요');
      if(S.surveyOpenAt + minMs > Date.now()) return tick();
      svDone.disabled = true;
      if(await markSurveyDone()) renderMy(); else svDone.disabled = false;
    };
  }
}

/* 앱 내 설문 (#/survey). 완주자만. 문항은 SURVEY(관리자 › 설문). 답 {문항id: 값} → DB.submitSurvey → 서버가 완주 확인 후 저장 + survey_done_at → 교환권.
   부스 고르기 문항은 내가 도장 찍은 부스를 칩으로 보여준다. 답은 이름과 함께 저장되지 않음(uuid 만) */
function renderSurvey(){
  if(!S.me) return renderRegister('/survey');
  if(!goalReached()) return go('/my', true);
  if(S.me.surveyAt) return go('/my', true);
  const A = {}, req = SURVEY.filter(q => q.required);
  const answered = q => { const v = A[q.id]; return Array.isArray(v) ? v.length > 0 : v !== undefined && String(v).trim() !== ''; };
  const mine = allStampsLocal().map(s => boothById(s.boothId)).filter(Boolean);
  const body = q => {
    if(q.type === 'scale') return `<div class="sv-scale">${SV_FACES.map((f, i) => `<button type="button" data-v="${i + 1}" aria-label="${i + 1}점">${f}</button>`).join('')}</div><div class="sv-scale-l"><span>별로예요</span><span>최고예요</span></div>`;
    if(q.type === 'single' || q.type === 'multi') return `<div class="sv-opts">${(q.opts || []).map(o => `<button type="button" class="sv-opt ${q.type === 'multi' ? 'chk' : ''}" data-v="${esc(o)}"><span class="dot"></span>${esc(o)}</button>`).join('')}</div>`;
    if(q.type === 'booth') return `<div class="sv-chips">${mine.map(b => `<button type="button" class="sv-chip" data-v="${esc(b.n)}"><b>${esc(b.n)}</b>${esc(clipName(b.name, 12))}</button>`).join('')}</div>${mine.length ? '' : `<input class="inp" inputmode="numeric" placeholder="부스 번호 (예: 12)" maxlength="4" data-text>`}`;
    if(q.type === 'text') return `<textarea class="inp" placeholder="자유롭게 적어주세요" maxlength="300" data-text></textarea>`;
    return '';
  };
  shell('/my', '참여 설문', `
    <div class="sv-hint"><span>🎁</span><span>설문을 제출하면 바로 선물 교환권이 열려요. 1분이면 끝나요.</span></div>
    <div class="sv-prog"><i id="svBar"></i></div>
    ${SURVEY.map((q, i) => `<div class="sv-q" data-id="${esc(q.id)}">
      <div class="n">Q${i + 1}${q.required ? '' : ' · 선택'}</div>
      <div class="t">${esc(q.title)}</div>${q.sub ? `<div class="s">${esc(q.sub)}</div>` : ''}
      ${body(q)}
      <div class="err-msg">답변을 골라주세요</div>
    </div>`).join('')}
    <p class="small muted" style="text-align:center;line-height:1.6">답변은 행사 운영 개선에만 쓰이고 이름과 함께 저장되지 않아요.</p>
    <div class="sv-foot"><span class="cnt" id="svCnt"></span><button class="btn blue full" id="svSubmit">제출하고 교환권 받기</button></div>`,
    { back: true, sub: CONFIG.eventTitle });
  const update = () => { const n = req.filter(answered).length; $('#svCnt').textContent = `${n} / ${req.length} 답변`; $('#svBar').style.width = (req.length ? n / req.length * 100 : 100) + '%'; };
  $$('.sv-q').forEach(el => {
    const q = SURVEY.find(x => x.id === el.dataset.id);
    $$('.sv-scale button, .sv-opt, .sv-chip', el).forEach(b => b.onclick = () => {
      if(q.type === 'multi'){ const set = new Set(A[q.id] || []); set.has(b.dataset.v) ? set.delete(b.dataset.v) : set.add(b.dataset.v); A[q.id] = [...set]; b.classList.toggle('on'); }
      else { A[q.id] = q.type === 'scale' ? +b.dataset.v : b.dataset.v; $$('.sv-scale button, .sv-opt, .sv-chip', el).forEach(x => x.classList.toggle('on', x === b)); }
      el.classList.remove('bad'); update();
    });
    const t = $('[data-text]', el); if(t) t.oninput = () => { A[q.id] = t.value; el.classList.remove('bad'); update(); };
  });
  update();
  $('#svSubmit').onclick = async () => {
    const missing = req.filter(q => !answered(q));
    if(missing.length){ missing.forEach(q => $(`.sv-q[data-id="${q.id}"]`).classList.add('bad')); $(`.sv-q[data-id="${missing[0].id}"]`).scrollIntoView({ behavior: 'smooth', block: 'center' }); return toast(`${missing.length}개 문항이 남았어요`); }
    const answers = {}; SURVEY.forEach(q => { if(answered(q)) answers[q.id] = typeof A[q.id] === 'string' ? A[q.id].trim().slice(0, 300) : A[q.id]; });
    $('#svSubmit').disabled = true;
    try{ await DB.submitSurvey(S.me.id, answers); S.me.surveyAt = Date.now(); await store.set('wj:me_cache', S.me); confetti(); toast('고마워요! 교환권이 열렸어요'); go('/my', true); }
    catch(e){ $('#svSubmit').disabled = false; toast(e.message || '저장에 실패했어요. 다시 눌러주세요'); }
  };
}

/* =====================================================================
   MAP
   ===================================================================== */
const view = { k: 1, tx: 0, ty: 0 };
function mapSVG(){
  const g = geom(); const { W, H, cx, cy } = g; const pos = boothPos(g); const done = stampedIds();
  const box = mapBox();
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${box.w}" height="${box.h}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" id="mapSvg"><g id="world">`;
  s += `<rect x="12" y="12" width="${W - 24}" height="${H - 24}" rx="130" fill="var(--plaza)"/>`;
  s += `<rect ${g.track.rect} fill="var(--track)"/>`;
  g.lanes.forEach(l => s += `<rect ${l.rect} fill="none" stroke="rgba(255,255,255,.7)" stroke-width="2"/>`);
  s += `<rect ${g.field.rect} fill="var(--field)"/>`;
  const P = g.pitch, ln = 'fill="none" stroke="rgba(255,255,255,.8)" stroke-width="2.5"';                               // 축구장
  s += `<g ${ln}><rect x="${P.x}" y="${P.y}" width="${P.w}" height="${P.h}"/><line x1="${cx}" y1="${P.y}" x2="${cx}" y2="${P.y + P.h}"/><circle cx="${cx}" cy="${cy}" r="40"/>
        <rect x="${P.x}" y="${cy - 64}" width="72" height="128"/><rect x="${P.x + P.w - 72}" y="${cy - 64}" width="72" height="128"/></g>`;
  s += `<rect x="${P.x - 14}" y="${cy - 30}" width="14" height="60" rx="3" fill="#4E8A5C"/><rect x="${P.x + P.w}" y="${cy - 30}" width="14" height="60" rx="3" fill="#4E8A5C"/>`;
  const mg = g.gates[0];                                                                                                   // 정문 → 트랙 통로
  s += `<line x1="${cx}" y1="${mg.y + mg.h / 2}" x2="${cx}" y2="${cy - g.far.hh + 4}" stroke="var(--ink-3)" stroke-width="2" stroke-dasharray="4 7"/>`;
  g.fac.forEach(f => {
    const fill = f.type === 'hq' ? 'var(--ink)' : '#fff', col = f.type === 'hq' ? '#fff' : 'var(--ink-2)';
    s += `<g class="fac"><rect x="${f.x - f.w / 2}" y="${f.y - f.h / 2}" width="${f.w}" height="${f.h}" rx="${Math.min(f.w, f.h) / 2}" fill="${fill}" ${f.type !== 'hq' ? 'stroke="var(--line)" stroke-width="2"' : ''}/>
      <text x="${f.x}" y="${f.y}" font-size="14" fill="${col}">${esc(f.label)}</text></g>`;
  });
  g.gates.forEach(gt => s += `<g class="fac gate" data-gate="${gt.id}"><rect x="${gt.x - gt.w / 2}" y="${gt.y - gt.h / 2}" width="${gt.w}" height="${gt.h}" rx="10" fill="var(--mint)"/>
      <path d="M ${gt.x - 9} ${gt.y + gt.h / 2 + 2} l 9 12 l 9 -12 z" fill="var(--mint)"/><text x="${gt.x}" y="${gt.y}" font-size="14" fill="#fff">${esc(gt.label)}</text></g>`);
  const cap = (x, y, txt, anchor = 'middle') => `<text class="zcap" x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}">${esc(txt)}</text>`;   // 구역 이름표
  [['hq', 1], ['photo', -1]].forEach(([z, dir]) => { const list = boothsIn(z); if(!list.length) return; const a = pos[list[0].id], b = pos[list[list.length - 1].id]; const f = g.band.mid.frame((a.ta + b.tb) / 2); s += cap(f.x, f.y + g.band.h / 2 + 16, `${zoneOf(z).name.split('·')[1].trim()} ${list.length}`); });
  ['goalL', 'goalR'].forEach(z => { const list = boothsIn(z); if(!list.length) return; const c = g.cols[z]; s += cap(c.x, g.colY0(list.length) - 38, zoneOf(z).name); });
  s += `<g id="routeLayer"></g>`;
  const visible = new Set(filteredBooths().map(b => b.id));
  S.booths.forEach(b => {
    const p = pos[b.id]; if(!p) return; const c = catOf(b.cat);
    const cls = `tile ${visible.has(b.id) ? '' : 'dim'} ${done.has(b.id) ? 'done' : ''} ${S.focus === b.id ? 'hi' : ''}`;
    if(p.rect){                                                                                                            // 골대 뒤 열: 둥근 네모
      s += `<g class="${cls}" data-id="${b.id}" data-x="${p.x.toFixed(0)}" data-y="${p.y.toFixed(0)}"><rect class="bg" x="${p.x - p.w / 2}" y="${p.y - p.h / 2}" width="${p.w}" height="${p.h}" rx="9" fill="${c.color}" stroke="#fff" stroke-width="2"/>
        <text class="num" x="${p.x}" y="${p.y}" font-size="15">${esc(b.n)}</text></g>`;
      return;
    }
    const fs = Math.max(10, Math.min(18, p.segW * .42));
    s += `<g class="${cls}" data-id="${b.id}" data-x="${p.x.toFixed(0)}" data-y="${p.y.toFixed(0)}">
      <path class="bg" d="${segPath(p.band, p.ta, p.tb)}" fill="${c.color}" stroke="#fff" stroke-width="2"/>
      <text class="num" x="${p.x.toFixed(1)}" y="${p.y.toFixed(1)}" font-size="${fs.toFixed(1)}">${esc(b.n)}</text></g>`;
  });
  s += `<g id="lblLayer"></g>`;
  s += `</g></svg>`;
  return s;
}
/* 드래그 경계: 지도가 화면 밖으로 완전히 나가지 못하게. 보이는 영역(검색바·탭바 뺀 부분) 안에 지도가 최소 40% 는 남아 있어야 함 */
function clampView(){
  const svg = $('#mapSvg'); if(!svg) return; const vb = svg.viewBox.baseVal, r = svg.getBoundingClientRect(); if(!r.width) return;
  const tl = svgPoint(svg, r.left + 10, r.top + MAP_INSET.top), br = svgPoint(svg, r.right - MAP_INSET.right, r.bottom - MAP_INSET.bottom);
  const vw = br.x - tl.x, vh = br.y - tl.y, ww = vb.width * view.k, wh = vb.height * view.k;
  const mx = Math.min(vw, ww) * .4, my = Math.min(vh, wh) * .4;   // 겹쳐 있어야 하는 최소 폭·높이
  view.tx = Math.min(br.x - mx, Math.max(tl.x + mx - ww, view.tx));
  view.ty = Math.min(br.y - my, Math.max(tl.y + my - wh, view.ty));
}
function applyView(){ const w = $('#world'); if(!w) return; clampView(); w.setAttribute('transform', `translate(${view.tx} ${view.ty}) scale(${view.k})`); const zoomed = view.k >= (view.fitK || 1) * 1.6; $('#mapSvg').classList.toggle('zoomed', zoomed); markNear(zoomed); }   // 전체 보기 대비 1.6배 이상이면 이름표·주변 띠
/* 확대 상태에서는 화면 가운데 주변 부스만 이름표를 단다. 100개 이름이 한꺼번에 뜨면 읽을 수 없어서.
   이름표는 칸 바깥 방향으로 놓되, 이미 놓인 이름표와 겹치면 한 단계 더 바깥으로 민다(줄 자동 배정). 칸과는 점선으로 잇는다. */
let nearKey = '', mapPos = null;
function markNear(zoomed){
  const svg = $('#mapSvg'), strip = $('#nearStrip'), layer = $('#lblLayer'); if(!svg || !strip || !layer) return;
  if(!zoomed){ if(nearKey){ nearKey = ''; strip.innerHTML = ''; layer.innerHTML = ''; } return; }
  const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal; const sc = Math.min(r.width / vb.width, r.height / vb.height);   // k=1일 때 SVG 단위당 화면 px
  const c = svgPoint(svg, r.left + r.width / 2, r.top + MAP_INSET.top + (r.height - MAP_INSET.top - MAP_INSET.bottom) / 2);
  const wx = (c.x - view.tx) / view.k, wy = (c.y - view.ty) / view.k, R = 150 / (sc * view.k);                                          // 화면 기준 150px 반경
  const visible = new Set(filteredBooths().map(b => b.id));
  let near = $$('.tile', svg).map(t => ({ id: t.dataset.id, d: Math.hypot(+t.dataset.x - wx, +t.dataset.y - wy) })).filter(o => o.d <= R && visible.has(o.id)).sort((a, b) => a.d - b.d).slice(0, 3);
  let solo = null;                                                                                                                   // 선택한 부스가 화면 밖(멀리)이면 따로 자기 칸 옆에만 단다
  if(S.focus && !near.some(o => o.id === S.focus) && visible.has(S.focus)){ solo = S.focus; near.unshift({ id: S.focus, d: 0 }); }
  const key = near.map(o => o.id).join(',') + '|' + S.focus; if(key === nearKey) return; nearKey = key;
  const done = stampedIds();
  strip.innerHTML = near.map(o => { const b = boothById(o.id), col = catOf(b.cat).color; return `<button class="nchip ${done.has(b.id) ? 'done' : ''} ${S.focus === b.id ? 'on' : ''}" style="--c:${col}" onclick="pickBooth('${b.id}')"><span class="bn">${esc(b.n)}</span>${esc(b.name)}</button>`; }).join('');
  let shelf = near.map(o => o.id).filter(id => id !== solo);
  if(solo){ const sp = (mapPos || (mapPos = boothPos()))[solo]; if(sp) shelf = shelf.filter(id => { const q = mapPos[id]; return !q || Math.hypot(q.x - sp.x, q.y - sp.y) > 150; }); }   // 선택 이름표 자리와 겹칠 이웃은 뺀다
  layer.innerHTML = layoutLabels(shelf) + (solo ? layoutLabels([solo]) : '');
}
function layoutLabels(ids){
  /* 골대 뒤 열: 칸 옆에 고정. 트랙 띠: 가까운 칸들을 링 순서대로 한 줄(3개 이하) 또는 두 줄(짝·홀 번갈아)로 '선반'처럼 나란히 놓는다.
     순서를 지키니 연결 점선이 서로 교차하지 않고, 선반은 무리 가운데 칸의 바깥 방향으로 뻗는다. */
  const pos = mapPos || (mapPos = boothPos()); const fs = 11.5, lh = fs * 1.22;
  const items = ids.map(id => ({ id, p: pos[id], b: boothById(id) })).filter(o => o.p && o.b && !o.p.ops);
  items.forEach(o => { o.lines = wrapName(o.b.name, 9); o.w = Math.max(...o.lines.map(l => textW(l, fs))) + 14; o.h = lh * o.lines.length + 8; });
  let out = '';
  let leads = '';

        cv.width = 480; cv.height = 480; ctx.drawImage(video, (w - side) / 2, (h - side) / 2, side, side, 0, 0, 480, 480);
        const img = ctx.getImageData(0, 0, 480, 480); const code = jsQR(img.data, 480, 480, { inversionAttempts: 'dontInvert' });
        if(code && code.data){ const n = parseBoothQR(code.data);
          if(n && boothByN(n)){ $('#scanHit').classList.add('on'); if(navigator.vibrate) navigator.vibrate(60); setTimeout(() => { closeScanner(); go('/stamp/' + n); }, 250); return; }
          if(!n) msg.innerHTML = '<b>행사 QR이 아니에요</b>부스 앞 안내판의 QR을 찍어주세요';
          else msg.innerHTML = `<b>${esc(n)}번 부스를 찾을 수 없어요</b>안내데스크에 문의해 주세요`;
        }
      }
      scanner.raf = requestAnimationFrame(tick);
    };
    scanner.raf = requestAnimationFrame(tick);
  }catch(e){
    const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
    msg.innerHTML = `<b>${denied ? '카메라 권한이 필요해요' : '카메라를 열 수 없어요'}</b>${denied ? '브라우저 주소창의 카메라 권한을 허용해 주세요.' : 'HTTPS 주소에서만 카메라가 열려요.'}<br>폰 기본 카메라 앱으로 QR을 찍어도 똑같이 도장이 찍혀요.<br><button class="btn sun sm" onclick="closeScanner()">알겠어요</button>`;
  }
}
function closeScanner(){
  scanner.on = false; cancelAnimationFrame(scanner.raf);
  if(scanner.stream){ scanner.stream.getTracks().forEach(t => t.stop()); scanner.stream = null; }
  const v = $('#scanVideo'); if(v) v.srcObject = null;
  $('#scan').classList.remove('show'); $('#scanHit').classList.remove('on');
}

  const cellText = v => v == null ? '' : typeof v === 'object' ? (v.text ?? (v.richText ? v.richText.map(r => r.text).join('') : v.result ?? v.hyperlink ?? '')) : String(v);
  const readXlsx = async f => { await loadExcelJS(); const wb = new ExcelJS.Workbook(); await wb.xlsx.load(await f.arrayBuffer()); const ws = wb.getWorksheet('부스') || wb.worksheets[0]; const rows = []; ws.eachRow((row, i) => { if(i === 1) return; rows.push(Array.from({ length: 9 }, (_, c) => cellText(row.getCell(c + 1).value).trim())); }); return rows; };

/* QR 인쇄 시트. 부스별 QR 주소 = base?b=번호&t=토큰. 토큰은 DB.boothTokens (부스가 서버에 없으면 먼저 저장해 발급). 같은 탭의 테스트 번호 입력도 통과되게 qrTok 에 넣음 */
function admQR(){
  const base = location.origin + location.pathname;
  admShell('qr', `
    <div class="card tight no-print row" style="flex-wrap:wrap;gap:10px">
      <div class="grow"><b>부스 QR 인쇄 시트</b><div class="small muted" style="margin-top:3px">QR 주소: <code>${esc(base)}?b=부스번호&t=토큰</code> — 토큰이 있어야 도장이 찍혀요(번호만 쳐서 찍는 치팅 차단). 도메인이 바뀌면 재인쇄해야 해요. 인쇄 전에 주소를 확정하세요.</div><div class="small" id="qrStatus" style="margin-top:3px"></div></div>
      <button class="btn sm" onclick="print()">인쇄</button></div>
    <div class="qrgrid">
      <div class="qrc" style="border:2px solid var(--ink)"><div class="qr" id="qr-entry"></div><div class="n" style="font-size:15px">입장 · 안내판용</div><div class="t">등록 화면으로 바로 이동</div><div class="u">${esc(base)}?join</div></div>
      ${S.booths.map(b => `<div class="qrc"><div class="qr" id="qr-${b.id}"></div><div class="n">${esc(b.n)}</div><div class="t">${esc(b.name)}</div><div class="u">${esc(b.org)}</div></div>`).join('')}</div>`);
  (async () => {
    let toks = {};
    if(DB === SupabaseDB){   // 서버 토큰. 부스가 아직 서버에 없으면(내장 시드 상태) 먼저 저장해서 발급받음
      try{
        toks = await DB.boothTokens();
        if(S.booths.some(b => !toks[b.id])){ $('#qrStatus').textContent = '부스를 서버에 저장하고 토큰을 발급하는 중…'; await DB.saveBooths(S.booths); toks = await DB.boothTokens(); }
        S.booths.forEach(b => qrTok.set(b.n, toks[b.id]));   // 같은 탭에서 테스트 번호 입력이 통과되게
        $('#qrStatus').textContent = '';
      }catch(e){ $('#qrStatus').innerHTML = `<span style="color:var(--coral)">토큰을 못 받았어요: ${esc(e.message)} — 이 상태로 인쇄하면 도장이 안 찍혀요</span>`; }
    }
    if(!window.QRCode) return;
    new QRCode($('#qr-entry'), { text: `${base}?join`, width: 256, height: 256, correctLevel: QRCode.CorrectLevel.M });
    S.booths.forEach(b => new QRCode($('#qr-' + b.id), { text: `${base}?b=${encodeURIComponent(b.n)}${toks[b.id] ? '&t=' + toks[b.id] : ''}`, width: 256, height: 256, correctLevel: QRCode.CorrectLevel.M }));
  })();
}

        <select class="inp sm" data-f="type" style="width:140px">${Object.entries(SV_TYPES).map(([k, v]) => `<option value="${k}" ${k === q.type ? 'selected' : ''}>${v}</option>`).join('')}</select>
        <label class="small" style="display:flex;align-items:center;gap:5px"><input type="checkbox" data-f="required" ${q.required ? 'checked' : ''}>필수</label>
        <span class="grow"></span><button class="btn xs soft" data-up="${i}">↑</button><button class="btn xs soft" data-down="${i}">↓</button><button class="btn xs line" data-del="${i}" style="color:var(--coral)">삭제</button></div>
      <input class="inp sm" data-f="title" value="${esc(q.title)}" placeholder="질문" maxlength="80">
      <input class="inp sm" data-f="sub" value="${esc(q.sub || '')}" placeholder="설명 (선택)" maxlength="80">
      ${q.type === 'single' || q.type === 'multi' ? `<textarea class="inp sm" data-f="opts" placeholder="보기 · 한 줄에 하나" style="min-height:70px;font-size:13px">${esc(q.opts.join('\n'))}</textarea>` : ''}
    </div>`).join('') || '<div class="empty">문항이 없어요. 추가하거나 기본 문항으로 되돌리세요</div>';
    $$('#sqList [data-f]').forEach(el => el.onchange = () => { const q = list[+el.closest('[data-i]').dataset.i]; const f = el.dataset.f; if(f === 'required') q.required = el.checked; else if(f === 'opts') q.opts = el.value.split('\n').map(x => x.trim()).filter(Boolean); else q[f] = el.value.trim(); if(f === 'type') drawEditor(); });
    $$('[data-up]').forEach(b => b.onclick = () => { const i = +b.dataset.up; if(i > 0){ [list[i - 1], list[i]] = [list[i], list[i - 1]]; drawEditor(); } });
    $$('[data-down]').forEach(b => b.onclick = () => { const i = +b.dataset.down; if(i < list.length - 1){ [list[i + 1], list[i]] = [list[i], list[i + 1]]; drawEditor(); } });
    $$('[data-del]').forEach(b => b.onclick = () => { list.splice(+b.dataset.del, 1); drawEditor(); });
  };
  drawEditor();
  $('#sqAdd').onclick = () => { if(list.length >= 20) return toast('문항은 20개까지예요'); list.push({ id: 'q' + Date.now().toString(36), type: 'single', title: '', sub: '', required: true, opts: [] }); drawEditor(); setTimeout(() => $$('#sqList [data-f=title]').pop()?.focus(), 50); };
  $('#sqReset').onclick = () => { if(!confirm('기본 문항 7개로 되돌릴까요? 저장을 눌러야 반영돼요.')) return; list.splice(0, list.length, ...DEFAULT_SURVEY.map(q => ({ ...q, opts: (q.opts || []).slice() }))); drawEditor(); };
  $('#sqSave').onclick = async () => {
    for(const q of list){ if(!q.title) return toast('질문이 비어 있는 문항이 있어요'); if((q.type === 'single' || q.type === 'multi') && q.opts.length < 2) return toast(`'${q.title}' 보기를 2개 이상 적어주세요`); }
    const ids = new Set(); for(const q of list){ if(ids.has(q.id)) q.id = q.id + '_' + Math.random().toString(36).slice(2, 5); ids.add(q.id); }
    $('#sqSave').disabled = true;
    try{ const data = { ...(S.settingsRaw || {}), survey: list.map(q => ({ id: q.id, type: q.type, title: q.title, sub: q.sub || '', required: !!q.required, ...(q.type === 'single' || q.type === 'multi' ? { opts: q.opts } : {}) })) }; await DB.saveSettings(data); applySettings(data); toast('저장했어요'); admSurvey(); }
    catch(e){ $('#sqSave').disabled = false; toast(e.message); }
  };
  let rows = null;
  const load = async () => { $('#sqRes').innerHTML = '<div class="empty">불러오는 중…</div>'; try{ rows = await DB.surveyAnswers(); }catch(e){ $('#sqRes').innerHTML = `<div class="empty">${esc(e.message)}${/PGRST202|admin_survey_answers/.test(e.message) ? '<br>SQL 9절(앱 내 설문)을 실행해주세요' : ''}</div>`; return; } drawResults(); };
  const drawResults = () => {
    if(!rows.length){ $('#sqRes').innerHTML = '<div class="empty">아직 응답이 없어요</div>'; return; }
    const bars = (pairs, total) => { const max = Math.max(1, ...pairs.map(p => p[1])); return `<div class="sv-res">${pairs.map(([k, v]) => `<div class="r"><div>${esc(k)}</div><div class="bar"><i style="width:${v / max * 100}%"></i></div><div class="v">${v}<small class="muted" style="font-weight:400"> ${total ? Math.round(v / total * 100) : 0}%</small></div></div>`).join('')}</div>`; };
    $('#sqRes').innerHTML = `<div class="small muted" style="margin-bottom:4px">응답 <b>${rows.length}</b>명 · 학년별 ${Object.entries(rows.reduce((m, r) => { const g = gradeGroup(r.grade) || '미입력'; m[g] = (m[g] || 0) + 1; return m; }, {})).map(([k, v]) => `${k} ${v}`).join(' · ')}</div>` + SURVEY.map((q, i) => {
      const vals = rows.map(r => r.answers?.[q.id]).filter(v => v !== undefined && v !== null && v !== '');
      let body = '';
      if(q.type === 'scale'){ const cnt = [1, 2, 3, 4, 5].map(k => [SV_FACES[k - 1] + ' ' + k, vals.filter(v => +v === k).length]); const avg = vals.length ? (vals.reduce((a, v) => a + +v, 0) / vals.length).toFixed(2) : '-'; body = `<div class="small" style="margin-bottom:6px">평균 <b style="font-size:18px">${avg}</b> / 5</div>` + bars(cnt, vals.length); }
      else if(q.type === 'single'){ const m = {}; vals.forEach(v => m[v] = (m[v] || 0) + 1); body = bars((q.opts || []).map(o => [o, m[o] || 0]).concat(Object.keys(m).filter(k => !(q.opts || []).includes(k)).map(k => [k, m[k]])), vals.length); }
      else if(q.type === 'multi'){ const m = {}; vals.forEach(v => [].concat(v).forEach(x => m[x] = (m[x] || 0) + 1)); body = bars((q.opts || []).map(o => [o, m[o] || 0]).concat(Object.keys(m).filter(k => !(q.opts || []).includes(k)).map(k => [k, m[k]])), vals.length); }
      else if(q.type === 'booth'){ const m = {}; vals.forEach(v => m[v] = (m[v] || 0) + 1); body = bars(Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, 10).map(([n, c]) => [`${n} ${boothByN(n)?.name || ''}`, c]), vals.length); }
      else body = vals.length ? `<div style="display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto">${vals.slice(-50).reverse().map(v => `<div class="sv-txt">${esc(v)}</div>`).join('')}</div>` : '';
      return `<div class="card tight"><div class="small muted">Q${i + 1} · ${SV_TYPES[q.type]} · 응답 ${vals.length}</div><b style="display:block;margin:2px 0 8px">${esc(q.title)}</b>${body || '<div class="empty">응답 없음</div>'}</div>`;
    }).join('');
  };
  $('#sqLoad').onclick = load;
  $('#sqCsv').onclick = async () => { if(!rows){ await load(); if(!rows) return; } download('survey.csv', '\ufeff' + [['제출시각', '학교', '학년', '학년군', '성별', ...SURVEY.map(q => q.title)]].concat(rows.map(r => [new Date(r.at).toLocaleString('ko-KR'), r.school, r.grade, gradeGroup(r.grade), r.gender, ...SURVEY.map(q => { const v = r.answers?.[q.id]; return Array.isArray(v) ? v.join(' | ') : (v ?? ''); })])).map(r => r.map(csv).join(',')).join('\n')); };
}
/* 데이터: CSV 내보내기 3종(스탬프·명단·부스별 집계), 비번 변경, 부스 기본값 복원, 데모 데이터(로컬), 개인정보 파기 */
function admData(st){
  const local = DB === LocalDB; const visitors = { length: st.visitors }, stamps = { length: st.stamps };
  admShell('data', `
    <div class="split">
      <div style="display:flex;flex-direction:column;gap:14px">
        <div class="card"><div class="h-sec" style="margin:0 0 10px">내보내기</div>
          <p class="small muted" style="line-height:1.6;margin-bottom:12px">행사 보고서용. 스탬프 기록은 방문객 이름·학교·학년·성별과 함께 나가요. 명단에는 학년군(초저·초고·중·고·성인)과 설문 완료 시각이 붙어요.</p>
          <div class="row" style="flex-wrap:wrap"><button class="btn sm" id="exStamps">스탬프 기록 CSV</button><button class="btn sm line" id="exVisitors">방문객 명단 CSV</button><button class="btn sm line" id="exSummary">부스별 집계 CSV</button></div></div>
        <div class="card"><div class="h-sec" style="margin:0 0 10px">설정</div>
          <div class="field" style="margin-bottom:12px"><label>관리자 비밀번호${local ? ' (이 세션)' : ''}</label><input class="inp" id="setPw" type="password" placeholder="새 비밀번호"></div>
          <button class="btn sm soft" id="setPwGo">바꾸기</button>
          <div class="field" style="margin-top:14px"><label>부스 목록</label><button class="btn sm line" id="boothReset">기본 배치도(90개)로 되돌리기</button></div>
          <p class="small muted" style="margin-top:12px;line-height:1.6">행사명·일시·완주 개수·설문 링크·일정·자료는 <b>행사 설정</b> 탭에서, Supabase 연결은 파일 상단 <code>CONFIG</code>에서 바꿔요.<br>현재 저장소: <b>${local ? '브라우저 로컬 (이 기기에만 저장)' : 'Supabase'}</b></p></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:14px">
        ${local ? `<div class="card"><div class="h-sec" style="margin:0 0 10px">데모</div><p class="small muted" style="line-height:1.6;margin-bottom:12px">화면 확인용 가짜 방문객 180명과 스탬프를 만들어요. 기존 기록은 지워져요.</p><button class="btn sm line" id="demoGo">데모 데이터 만들기</button></div>` : ''}
        <div class="dz"><div class="t">개인정보 파기</div><p>방문객 ${visitors.length}명, 스탬프 ${stamps.length}개를 모두 삭제해요. 행사 종료 후 보고서를 뽑은 다음 실행하세요. 되돌릴 수 없어요.</p>
          <button class="btn sm" style="background:var(--coral);margin-top:12px" id="purgeGo">전부 삭제</button></div>
      </div>
    </div>`);
  const fetchAll = async () => { toast('내보낼 데이터를 모으는 중…'); const [stamps, visitors] = await Promise.all([DB.allStamps(), DB.allVisitors()]); return { stamps, visitors, vmap: Object.fromEntries(visitors.map(v => [v.id, v])) }; };
  $('#exStamps').onclick = async () => { const { stamps, vmap } = await fetchAll(); download('stamps.csv', '\ufeff' + [['시각', '부스번호', '부스명', '이름', '학교', '학년', '성별']].concat(stamps.slice().sort((a, b) => a.at - b.at).map(s => { const b = boothById(s.boothId), v = vmap[s.visitorId]; return [new Date(s.at).toLocaleString('ko-KR'), b?.n || '', b?.name || '', v?.name || '', v?.school || '', v?.grade || '', v?.gender || '']; })).map(r => r.map(csv).join(',')).join('\n')); };
  $('#exVisitors').onclick = async () => { const { stamps, visitors } = await fetchAll(); const cnt = {}; stamps.forEach(s => cnt[s.visitorId] = (cnt[s.visitorId] || 0) + 1); download('visitors.csv', '\ufeff' + [['등록시각', '이름', '학교', '학년', '학년군', '성별', '스탬프수', '설문완료', '선물수령']].concat(visitors.map(v => [new Date(v.createdAt).toLocaleString('ko-KR'), v.name, v.school || '', v.grade || '', gradeGroup(v.grade), v.gender || '', cnt[v.id] || 0, v.surveyAt ? new Date(v.surveyAt).toLocaleString('ko-KR') : '', v.giftAt ? new Date(v.giftAt).toLocaleString('ko-KR') : ''])).map(r => r.map(csv).join(',')).join('\n')); };
  $('#exSummary').onclick = () => { const cnt = {}; Object.entries(st.perBooth).forEach(([k, v]) => cnt[k] = v.n); download('booth_summary.csv', '\ufeff' + [['부스번호', '부스명', '운영기관', '분류', '스탬프수']].concat(S.booths.map(b => [b.n, b.name, b.org, catOf(b.cat).name, cnt[b.id] || 0])).map(r => r.map(csv).join(',')).join('\n')); };
  $('#boothReset').onclick = async () => { if(!confirm('저장된 부스 목록을 지우고 파일에 든 기본 배치도(90 + 운영·네컷 5)로 되돌릴까요? 도장 기록은 그대로예요.')) return;
    if(DB === LocalDB){ try{ localStorage.removeItem('wj:booths'); }catch(e){} delete mem['wj:booths']; } else { await DB.saveBooths([]); }
    await loadBooths(); await DB.saveBooths(S.booths); toast('기본 배치도로 되돌렸어요'); renderAdmin('booths'); };
  $('#setPwGo').onclick = async () => { const v = $('#setPw').value.trim(); if(v.length < 8) return toast('8자 이상으로 해주세요');
    if(local){ mem['wj:pw'] = v; return toast('이 세션의 비밀번호를 바꿨어요'); }
    try{ await DB.setPassword(v); $('#setPw').value = ''; toast('비밀번호를 바꿨어요'); }catch(e){ toast(e.message); } };
  const demo = $('#demoGo'); if(demo) demo.onclick = async () => { if(!confirm('기존 기록을 지우고 데모 데이터를 만들까요?')) return; await DB.seedDemo(S.booths); toast('데모 데이터를 만들었어요'); go(admPath('/dash')); };
  $('#purgeGo').onclick = async () => { if(prompt('정말 삭제하려면 "삭제"라고 입력하세요') !== '삭제') return; await DB.purgeVisitors(); S.me = null; S.myStamps = []; S.surveyOpenAt = 0; toast('모두 삭제했어요'); renderAdmin('data'); };
}
const csv = v => { v = String(v ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
function parseCSV(t){ const rows = [], re = /("([^"]|"")*"|[^,\n\r]*)(,|\r?\n|$)/g; let row = [], m; t = t.replace(/^\ufeff/, ''); if(!/\n$/.test(t)) t += '\n';   /* \ub9c8\uc9c0\ub9c9 \uce78\uc774 \ube44\uace0 \ub05d\uc5d0 \uc904\ubc14\uafc8\uc774 \uc5c6\uc73c\uba74 \ub9c8\uc9c0\ub9c9 \ud589\uc774 \ube60\uc9c0\ub358 \ubb38\uc81c */ while((m = re.exec(t)) && m[0] !== ''){ let f = m[1]; if(f.startsWith('"')) f = f.slice(1, -1).replace(/""/g, '"'); row.push(f.trim()); if(m[3] !== ','){ rows.push(row); row = []; } } return rows.filter(r => r.some(x => x)); }
function download(name, text){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }

/* =====================================================================
   BOOT — 부팅 순서
   1. 관리자 세션 복원 (sessionStorage 에 비번 있으면)
   2. 부스 목록 + 행사 설정 (병렬)
   3. 내 정보·내 도장 (store 'wj:me' 기준, 실패 시 캐시)
   4. 못 보낸 도장 재전송 시도
   5. QR 딥링크(?b=번호&t=토큰) 또는 입장 QR(?join) 을 해시 라우트로 바꾸고 route()
   ===================================================================== */
(async function boot(){
  if(DB === SupabaseDB && adminAuth.pw()) S.admin = true;   // 새로고침해도 관리자 유지 (탭 닫으면 사라짐). 비번이 바뀌었으면 첫 관리자 RPC 에서 로그아웃됨
  await Promise.all([loadBooths(), loadSettings()]);
  await loadMe();
  flushPending();
  // QR 딥링크: ?b=07&t=토큰 → 스탬프 화면. 토큰은 세션에 두고 주소창에서 쿼리는 지워서 새로고침 시 재진입을 막는다.
  const qs = new URLSearchParams(location.search); const b = qs.get('b');
  if(b){ qrTok.set(b, qs.get('t')); history.replaceState(null, '', location.pathname + '#/stamp/' + b); }
  else if(qs.has('join')){ history.replaceState(null, '', location.pathname + (S.me ? '#/' : '#/register')); }   // 안내판·포스터용 입장 QR
  else if(qs.has('survey')){ S.surveyReturn = true; history.replaceState(null, '', location.pathname + '#/my'); }   // 구글폼 확인 메시지의 복귀 링크 → 내 스탬프에서 자동 완료 처리 (미등록이면 등록/이어받기 뒤에)
  route();
})();
</script>
